<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QuasWave Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(94, 70, 255, 0.34), transparent 32%),
                radial-gradient(circle at bottom right, rgba(0, 194, 255, 0.24), transparent 28%),
                #0b0f1a;
            color: #f5f7ff;
            display: flex;
            justify-content: center;
        }

        button {
            border: none;
            background: none;
            color: inherit;
            font: inherit;
            cursor: pointer;
        }

        .app {
            width: 100%;
            max-width: 520px;
            min-height: 100vh;
            padding: 20px 16px 28px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .logo {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: linear-gradient(135deg, #7b52ff, #00c2ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 15px;
            flex: 0 0 auto;
            box-shadow: 0 10px 30px rgba(0, 194, 255, 0.22);
        }

        .brand-text {
            min-width: 0;
        }

        .brand-text h1 {
            font-size: 22px;
            line-height: 1.05;
            letter-spacing: 0.6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .brand-text p {
            margin-top: 3px;
            font-size: 12px;
            color: #9aa4c7;
        }

        .icon-btn {
            padding: 10px 12px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 18px;
            line-height: 1;
            flex: 0 0 auto;
        }

        .mode-label {
            padding: 11px 13px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #d7deff;
            font-size: 14px;
            line-height: 1.35;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .card {
            padding: 22px 16px;
            border-radius: 26px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.26);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .cover {
            width: 176px;
            height: 176px;
            max-width: 100%;
            border-radius: 26px;
            background:
                radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.22), transparent 22%),
                linear-gradient(135deg, #6d4aff, #00c2ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: 900;
            box-shadow: 0 18px 50px rgba(0, 194, 255, 0.2);
        }

        .track-info {
            width: 100%;
            text-align: center;
            min-width: 0;
        }

        .track-title {
            font-size: 27px;
            font-weight: 900;
            line-height: 1.15;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .track-artist {
            margin-top: 8px;
            font-size: 18px;
            color: #aab4d8;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .progress {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .time-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            font-size: 13px;
            color: #9aa4c7;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #63e6ff;
            cursor: pointer;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .control-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            line-height: 1;
        }

        .play-btn {
            width: 82px;
            height: 82px;
            font-size: 34px;
            background: linear-gradient(135deg, #7b52ff, #00c2ff);
            box-shadow: 0 16px 40px rgba(0, 194, 255, 0.26);
        }

        .footer {
            display: flex;
            justify-content: center;
        }

        .backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.38);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 25;
        }

        .backdrop.show {
            opacity: 1;
            pointer-events: auto;
        }

        .likes-panel {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 78vh;
            max-height: 78vh;
            background: #101527;
            border-top-left-radius: 22px;
            border-top-right-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transform: translateY(100%);
            transition: transform 0.24s ease;
            z-index: 30;
            display: flex;
            flex-direction: column;
            box-shadow: 0 -20px 70px rgba(0, 0, 0, 0.4);
        }

        .likes-panel.open {
            transform: translateY(0);
        }

        .likes-header {
            padding: 16px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .likes-title {
            font-size: 20px;
            font-weight: 900;
        }

        .likes-user {
            margin-top: 6px;
            font-size: 12px;
            color: #9aa4c7;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .likes-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            -webkit-overflow-scrolling: touch;
        }

        .like-item {
            padding: 13px 14px;
            margin-bottom: 9px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.07);
            cursor: pointer;
            overflow-wrap: anywhere;
            word-break: break-word;
            line-height: 1.35;
        }

        .like-item:last-child {
            margin-bottom: 0;
        }

        .loading {
            position: fixed;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%) translateY(16px);
            padding: 9px 14px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.62);
            color: #fff;
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.18s ease, transform 0.18s ease;
            z-index: 50;
        }

        .loading.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast {
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%) translateY(-18px);
            max-width: calc(100vw - 24px);
            padding: 10px 14px;
            border-radius: 14px;
            background: rgba(15, 18, 30, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 14px;
            line-height: 1.3;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.18s ease, transform 0.18s ease;
            z-index: 60;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <div class="brand">
                <div class="logo">QW</div>
                <div class="brand-text">
                    <h1>QUASWAVE</h1>
                    <p>волна last.fm</p>
                </div>
            </div>
            <button id="openLikesBtn" class="icon-btn" title="Лайки">❤️</button>
        </div>

        <div id="modeLabel" class="mode-label">🎵 Волна QuasWave</div>

        <div class="card">
            <div class="cover">QW</div>

            <div class="track-info">
                <div id="trackTitle" class="track-title">Готов слушать?</div>
                <div id="trackArtist" class="track-artist">QuasWave</div>
            </div>

            <div class="progress">
                <div class="time-row">
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                </div>
                <input id="seek" type="range" min="0" max="0" step="1" value="0">
            </div>

            <div class="controls">
                <button id="likeBtn" class="control-btn" title="Лайк">👍</button>
                <button id="playBtn" class="control-btn play-btn" title="Play/Pause">▶</button>
                <button id="nextBtn" class="control-btn" title="Следующий">⏭</button>
                <button id="dislikeBtn" class="control-btn" title="Дизлайк">👎</button>
            </div>
        </div>

        <div class="footer">
            <button id="muteBtn" class="icon-btn" title="Звук">🔊</button>
        </div>
    </div>

    <div id="backdrop" class="backdrop"></div>

    <div id="likesPanel" class="likes-panel">
        <div class="likes-header">
            <div>
                <div class="likes-title">❤️ Лайки</div>
                <div id="likesUser" class="likes-user">user_id: ...</div>
            </div>
            <button id="closeLikesBtn" class="icon-btn" title="Закрыть">✖️</button>
        </div>
        <div id="likesList" class="likes-list"></div>
    </div>

    <div id="loading" class="loading">Загрузка...</div>
    <div id="toast" class="toast"></div>

    <audio id="audio" preload="auto"></audio>

    <script>
        const APP_VERSION = "20260801-10";

        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;

        if (tg) {
            try {
                tg.ready();
                tg.expand();

                if (tg.setHeaderColor) {
                    tg.setHeaderColor("#0b0f1a");
                }
            } catch (e) {
                console.error("Telegram WebApp init failed", e);
            }
        }

        const params = new URLSearchParams(window.location.search);

        function b64ToUtf8(base64) {
            const binary = atob(base64);
            const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
            return new TextDecoder().decode(bytes);
        }

        function decodeB64UrlSafe(value) {
            if (!value) {
                return "";
            }

            let base64 = value.replace(/-/g, "+").replace(/_/g, "/");

            while (base64.length % 4) {
                base64 += "=";
            }

            return b64ToUtf8(base64);
        }

        let initialData = {};

        try {
            const rawData = params.get("data");

            if (rawData) {
                initialData = JSON.parse(decodeB64UrlSafe(rawData));
            }
        } catch (e) {
            console.error("Cannot parse initial data", e);
        }

        let apiBase = "https://differences-terminal-identical-egg.trycloudflare.com";

        try {
            const apiParam = params.get("api_base");

            if (apiParam) {
                apiBase = decodeB64UrlSafe(apiParam);
            }
        } catch (e) {
            console.error("Cannot parse api_base", e);
        }

        apiBase = (apiBase || "").replace(/\/+$/g, "");

        function firstDefined(...values) {
            for (const value of values) {
                if (value !== undefined && value !== null && String(value).length > 0) {
                    return String(value);
                }
            }

            return "";
        }

        const tgUserId = tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id
            ? String(tg.initDataUnsafe.user.id)
            : "";

        const state = {
            userId: firstDefined(tgUserId, initialData.user_id, params.get("user_id"), "0"),
            artist: initialData.artist || "",
            title: initialData.title || initialData.track || "",
            fileUrl: initialData.file_url || "",
            mode: initialData.mode || "",
            seedArtist: initialData.seed_artist || "",
            seedTrack: initialData.seed_track || "",
            likesPage: 1,
            likesPages: 1,
            likesLoading: false,
            likesLoaded: false,
            nextLoading: false
        };

        const audio = document.getElementById("audio");
        const trackTitle = document.getElementById("trackTitle");
        const trackArtist = document.getElementById("trackArtist");
        const modeLabel = document.getElementById("modeLabel");
        const currentTime = document.getElementById("currentTime");
        const duration = document.getElementById("duration");
        const seek = document.getElementById("seek");
        const playBtn = document.getElementById("playBtn");
        const nextBtn = document.getElementById("nextBtn");
        const likeBtn = document.getElementById("likeBtn");
        const dislikeBtn = document.getElementById("dislikeBtn");
        const muteBtn = document.getElementById("muteBtn");
        const openLikesBtn = document.getElementById("openLikesBtn");
        const closeLikesBtn = document.getElementById("closeLikesBtn");
        const likesPanel = document.getElementById("likesPanel");
        const backdrop = document.getElementById("backdrop");
        const likesList = document.getElementById("likesList");
        const likesUser = document.getElementById("likesUser");
        const loading = document.getElementById("loading");
        const toast = document.getElementById("toast");

        let toastTimer = null;

        function haptic(style) {
            try {
                if (tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred) {
                    tg.HapticFeedback.impactOccurred(style || "light");
                }
            } catch (e) {
                console.error("Haptic failed", e);
            }
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add("show");

            if (toastTimer) {
                clearTimeout(toastTimer);
            }

            toastTimer = setTimeout(() => {
                toast.classList.remove("show");
            }, 2600);
        }

        function setLoading(on) {
            loading.classList.toggle("show", !!on);
        }

        function formatTime(seconds) {
            if (!isFinite(seconds) || seconds < 0) {
                return "0:00";
            }

            const total = Math.floor(seconds);
            const minutes = Math.floor(total / 60);
            const rest = total % 60;

            return minutes + ":" + String(rest).padStart(2, "0");
        }

        function updateModeLabel() {
            let text = "🎵 Волна QuasWave";

            if (state.mode === "likes") {
                text = "❤️ Волна по лайкам";
            } else if (state.mode === "artist") {
                text = "🎤 Волна по исполнителю: " + (state.seedArtist || state.artist || "");
            } else if (state.mode === "track") {
                text = "🎶 Волна по треку: " + (state.seedArtist || state.artist || "") + " — " + (state.seedTrack || state.title || "");
            } else if (state.artist && state.title) {
                text = "🎶 Волна по треку: " + state.artist + " — " + state.title;
            }

            modeLabel.textContent = text;
        }

        function updateTrackInfo() {
            trackTitle.textContent = state.title || "Готов слушать?";
            trackArtist.textContent = state.artist || "QuasWave";

            if (state.artist && state.title) {
                document.title = state.artist + " - " + state.title + " | QuasWave";
            } else {
                document.title = "QuasWave Player";
            }

            updateModeLabel();
        }

        function updatePlayIcon() {
            playBtn.textContent = audio.paused ? "▶" : "⏸";
        }

        function setMedia(artist, title, fileUrl, mode, seedArtist, seedTrack) {
            if (artist) {
                state.artist = artist;
            }

            if (title) {
                state.title = title;
            }

            if (fileUrl) {
                state.fileUrl = fileUrl;
            }

            if (mode) {
                state.mode = mode;
            }

            if (seedArtist !== undefined && seedArtist !== null && seedArtist !== "") {
                state.seedArtist = seedArtist;
            }

            if (seedTrack !== undefined && seedTrack !== null && seedTrack !== "") {
                state.seedTrack = seedTrack;
            }

            if (state.mode === "track") {
                if (!state.seedArtist && state.artist) {
                    state.seedArtist = state.artist;
                }

                if (!state.seedTrack && state.title) {
                    state.seedTrack = state.title;
                }
            }

            updateTrackInfo();

            if (state.fileUrl) {
                audio.src = state.fileUrl;
                audio.load();
            }
        }

        async function apiFetch(path, options) {
            options = options || {};

            const headers = Object.assign({}, options.headers || {});

            if (tg && tg.initData) {
                headers["X-Telegram-Init-Data"] = tg.initData;
            }

            const fetchOptions = {
                method: options.method || "GET",
                cache: "no-store",
                headers: headers
            };

            if (options.json !== undefined) {
                headers["Content-Type"] = "application/json";
                fetchOptions.body = JSON.stringify(options.json);
            }

            const url = apiBase + path;
            const response = await fetch(url, fetchOptions);

            if (!response.ok) {
                let message = "HTTP " + response.status;

                try {
                    const data = await response.json();

                    if (data && data.error) {
                        message = data.error;
                    }
                } catch (e) {
                    console.error("Cannot parse error response", e);
                }

                throw new Error(message);
            }

            return response.json();
        }

        function withUser(path) {
            const separator = path.includes("?") ? "&" : "?";
            return path + separator + "user_id=" + encodeURIComponent(state.userId);
        }

        function buildNextPath() {
            const query = new URLSearchParams();

            query.set("user_id", state.userId);

            if (state.mode) {
                query.set("mode", state.mode);
            }

            if (state.seedArtist) {
                query.set("artist", state.seedArtist);
            }

            if (state.seedTrack) {
                query.set("track", state.seedTrack);
            }

            return "/api/next_track?" + query.toString();
        }

        async function playAudio() {
            try {
                await audio.play();
            } catch (e) {
                console.error("Play failed", e);
                showToast("Не удалось воспроизвести");
            }
        }

        async function ensureInitialAndPlay() {
            setLoading(true);

            try {
                if (state.fileUrl) {
                    updatePlayIcon();
                    await playAudio();
                    return;
                }

                await requestNext(true);
            } finally {
                setLoading(false);
            }
        }

        async function requestNext(autoplay) {
            if (state.nextLoading) {
                return;
            }

            state.nextLoading = true;
            setLoading(true);

            try {
                const data = await apiFetch(buildNextPath());

                setMedia(
                    data.artist,
                    data.title,
                    data.file_url,
                    data.mode,
                    data.seed_artist,
                    data.seed_track
                );

                if (autoplay) {
                    await playAudio();
                }
            } catch (e) {
                console.error("Next track failed", e);
                showToast(e.message || "Ошибка загрузки");
            } finally {
                state.nextLoading = false;
                setLoading(false);
                updatePlayIcon();
            }
        }

        async function startTrack(artist, track, autoplay) {
            setLoading(true);

            try {
                const data = await apiFetch(withUser("/api/start_track"), {
                    method: "POST",
                    json: {
                        artist: artist,
                        track: track
                    }
                });

                setMedia(
                    data.artist,
                    data.title,
                    data.file_url,
                    data.mode,
                    data.seed_artist,
                    data.seed_track
                );

                if (autoplay) {
                    await playAudio();
                }
            } catch (e) {
                console.error("Start track failed", e);
                showToast(e.message || "Не удалось запустить трек");
            } finally {
                setLoading(false);
                updatePlayIcon();
            }
        }

        async function startArtist(artist) {
            setLoading(true);

            try {
                const data = await apiFetch(withUser("/api/start_artist"), {
                    method: "POST",
                    json: {
                        artist: artist
                    }
                });

                setMedia(
                    data.artist,
                    data.title,
                    data.file_url,
                    data.mode,
                    data.seed_artist,
                    data.seed_track
                );

                await playAudio();
            } catch (e) {
                console.error("Start artist failed", e);
                showToast(e.message || "Не удалось запустить волну по исполнителю");
            } finally {
                setLoading(false);
                updatePlayIcon();
            }
        }

        async function likeCurrent() {
            if (!state.artist || !state.title) {
                showToast("Сначала запусти трек");
                return;
            }

            try {
                await apiFetch(withUser("/api/like"), {
                    method: "POST",
                    json: {
                        artist: state.artist,
                        track: state.title
                    }
                });

                haptic("medium");
                showToast("Лайк сохранён");

                state.likesLoaded = false;

                if (likesPanel.classList.contains("open")) {
                    loadLikes(true);
                }
            } catch (e) {
                console.error("Like failed", e);
                showToast(e.message || "Ошибка лайка");
            }
        }

        async function dislikeCurrent() {
            if (!state.artist || !state.title) {
                await requestNext(true);
                return;
            }

            setLoading(true);

            try {
                await apiFetch(withUser("/api/dislike"), {
                    method: "POST",
                    json: {
                        artist: state.artist,
                        track: state.title
                    }
                });

                haptic("heavy");
                showToast("Дизлайк учтён");

                state.likesLoaded = false;

                await requestNext(true);
            } catch (e) {
                console.error("Dislike failed", e);
                showToast(e.message || "Ошибка дизлайка");
                setLoading(false);
            }
        }

        playBtn.addEventListener("click", async () => {
            haptic("light");

            if (!audio.src) {
                await ensureInitialAndPlay();
                return;
            }

            if (audio.paused) {
                await playAudio();
            } else {
                audio.pause();
            }

            updatePlayIcon();
        });

        nextBtn.addEventListener("click", () => {
            haptic("light");
            requestNext(true);
        });

        likeBtn.addEventListener("click", likeCurrent);
        dislikeBtn.addEventListener("click", dislikeCurrent);

        muteBtn.addEventListener("click", () => {
            audio.muted = !audio.muted;
            muteBtn.textContent = audio.muted ? "🔇" : "🔊";
            haptic("light");
        });

        audio.addEventListener("play", updatePlayIcon);
        audio.addEventListener("pause", updatePlayIcon);

        audio.addEventListener("timeupdate", () => {
            if (isFinite(audio.duration) && audio.duration > 0) {
                seek.max = Math.floor(audio.duration);
                seek.value = Math.floor(audio.currentTime);
                currentTime.textContent = formatTime(audio.currentTime);
                duration.textContent = formatTime(audio.duration);
            }
        });

        audio.addEventListener("loadedmetadata", () => {
            if (isFinite(audio.duration)) {
                seek.max = Math.floor(audio.duration);
                duration.textContent = formatTime(audio.duration);
            }
        });

        audio.addEventListener("ended", () => {
            requestNext(true);
        });

        audio.addEventListener("error", () => {
            if (audio.src) {
                showToast("Ошибка аудио. Попробуй следующий трек.");
            }

            updatePlayIcon();
        });

        seek.addEventListener("input", () => {
            if (isFinite(audio.duration) && audio.duration > 0 && seek.max) {
                audio.currentTime = (Number(seek.value) / Number(seek.max)) * audio.duration;
                currentTime.textContent = formatTime(audio.currentTime);
            }
        });

        function openLikes() {
            likesPanel.classList.add("open");
            backdrop.classList.add("show");
            likesUser.textContent = "user_id: " + state.userId;

            if (!state.likesLoaded) {
                loadLikes(true);
            }
        }

        function closeLikes() {
            likesPanel.classList.remove("open");
            backdrop.classList.remove("show");
        }

        openLikesBtn.addEventListener("click", openLikes);
        closeLikesBtn.addEventListener("click", closeLikes);
        backdrop.addEventListener("click", closeLikes);

        async function loadLikes(reset) {
            if (state.likesLoading) {
                return;
            }

            if (reset) {
                state.likesPage = 1;
                state.likesPages = 1;
                state.likesLoaded = false;
                likesList.innerHTML = "";
            }

            if (state.likesLoaded && state.likesPage > state.likesPages) {
                return;
            }

            state.likesLoading = true;

            try {
                const data = await apiFetch(
                    withUser("/api/likes?page=" + encodeURIComponent(state.likesPage) + "&page_size=15")
                );

                if (reset) {
                    likesList.innerHTML = "";
                }

                state.likesPage = data.page;
                state.likesPages = data.pages;

                likesUser.textContent = "user_id: " + data.user_id + " • всего " + data.total;

                (data.items || []).forEach((item) => {
                    const row = document.createElement("div");
                    row.className = "like-item";
                    row.textContent = item.artist + " — " + item.track;

                    row.addEventListener("click", () => {
                        haptic("light");
                        closeLikes();
                        startTrack(item.artist, item.track, true);
                    });

                    likesList.appendChild(row);
                });

                if (state.likesPage >= state.likesPages) {
                    state.likesLoaded = true;
                } else {
                    state.likesPage += 1;
                }
            } catch (e) {
                console.error("Likes load failed", e);
                showToast(e.message || "Не удалось загрузить лайки");
            } finally {
                state.likesLoading = false;
            }
        }

        likesList.addEventListener("scroll", () => {
            if (state.likesLoaded || state.likesLoading) {
                return;
            }

            if (likesList.scrollTop + likesList.clientHeight >= likesList.scrollHeight - 120) {
                loadLikes(false);
            }
        });

        if (initialData && initialData.artist && (initialData.title || initialData.track)) {
            setMedia(
                initialData.artist,
                initialData.title || initialData.track,
                initialData.file_url,
                initialData.mode,
                initialData.seed_artist,
                initialData.seed_track
            );
        } else {
            updateTrackInfo();
        }

        updatePlayIcon();
    </script>
</body>
</html>
