<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QuasWave Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }
        .cover {
            width: min(280px, 80vw);
            height: min(280px, 80vw);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 100px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .track-info { text-align: center; margin-bottom: 30px; width: 100%; padding: 0 20px; }
        .track-title { font-size: clamp(18px, 5vw, 26px); font-weight: bold; margin-bottom: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .track-artist { font-size: clamp(14px, 4vw, 18px); opacity: 0.7; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .progress-bar { width: 100%; max-width: 400px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; margin-bottom: 30px; overflow: hidden; }
        .progress { height: 100%; background: #667eea; width: 0%; transition: width 0.1s; }
        .controls { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; align-items: center; justify-items: center; width: 100%; max-width: 400px; padding: 0 10px; }
        button {
            background: rgba(255,255,255,0.1); color: #ffffff; border: none;
            padding: 12px; border-radius: 50%; font-size: 20px; font-weight: bold;
            cursor: pointer; transition: all 0.2s; backdrop-filter: blur(10px);
            width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
        }
        button:active { transform: scale(0.9); background: rgba(255,255,255,0.2); }
        button.like { background: rgba(46, 204, 113, 0.3); }
        button.like.active { background: #2ecc71; }
        button.dislike { background: rgba(231, 76, 60, 0.3); }
        button.play { background: #667eea; width: 70px; height: 70px; font-size: 28px; }
        .loading { opacity: 0.5; pointer-events: none; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 0.3; } }
        #startOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 1000;
        }
        #startOverlay.hidden { display: none; }
        .status { margin-top: 20px; font-size: 14px; opacity: 0.7; min-height: 20px; text-align: center; color: #ff6b6b; }
        .debug-info { margin-top: 10px; font-size: 12px; color: #888; word-break: break-all; max-width: 90vw; text-align: center; }
    </style>
</head>
<body>
    <div id="startOverlay">
        <div class="cover">🎵</div>
        <h2 style="margin: 20px 0;">Готов слушать?</h2>
        <button id="startBtn" style="padding: 20px 40px; font-size: 24px; background: #667eea; width: auto; height: auto; border-radius: 50px;">▶️ Начать</button>
    </div>

    <div class="cover">🎵</div>
    <div class="track-info">
        <div class="track-title" id="title">Загрузка...</div>
        <div class="track-artist" id="artist">Подожди немного</div>
    </div>
    <div class="progress-bar"><div class="progress" id="progressBar"></div></div>
    <audio id="audioPlayer" preload="auto"></audio>

    <div class="controls">
        <button id="likeBtn" class="like">👍</button>
        <button id="prevBtn">⏮️</button>
        <button id="playBtn" class="play">▶️</button>
        <button id="nextBtn">⏭️</button>
        <button id="dislikeBtn" class="dislike">👎</button>
    </div>
    <div class="status" id="status"></div>
    <div class="debug-info" id="debugInfo"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const audio = document.getElementById('audioPlayer');
        const titleEl = document.getElementById('title');
        const artistEl = document.getElementById('artist');
        const progressBar = document.getElementById('progressBar');
        const playBtn = document.getElementById('playBtn');
        const nextBtn = document.getElementById('nextBtn');
        const prevBtn = document.getElementById('prevBtn');
        const likeBtn = document.getElementById('likeBtn');
        const dislikeBtn = document.getElementById('dislikeBtn');
        const startOverlay = document.getElementById('startOverlay');
        const startBtn = document.getElementById('startBtn');
        const statusEl = document.getElementById('status');
        const debugEl = document.getElementById('debugInfo');

        let currentTrackData = null;
        let hasInteracted = false;
        let isPlaying = false;
        let eventSource = null;

        function updateStatus(text) { statusEl.innerText = text; }
        function debug(text) { debugEl.innerText = text; console.log(text); }

        function connectSSE(userId) {
            if (eventSource) eventSource.close();

            // !!! ВСТАВЬ СЮДА ТОЧНО ТАКОЙ ЖЕ URL, КАК В wave.py !!!
            const cloudflareUrl = "https://differences-terminal-identical-egg.trycloudflare.com";
            const sseUrl = `${cloudflareUrl}/stream/${userId}`;
            debug("Попытка SSE: " + sseUrl);

            eventSource = new EventSource(sseUrl);

            eventSource.onopen = () => {
                debug("✅ SSE соединен");
                updateStatus("Соединение установлено");
                setTimeout(() => { updateStatus(""); debug(""); }, 3000);
            };

            eventSource.addEventListener('new_track', (event) => {
                debug("🎵 Получен new_track");
                try {
                    const trackData = JSON.parse(event.data);
                    loadTrack(trackData, true);
                } catch (e) {
                    debug("Ошибка парсинга new_track: " + e.message);
                }
            });

            eventSource.addEventListener('liked', () => {
                updateStatus("👍 Добавлено в лайки!");
                setTimeout(() => updateStatus(""), 2000);
            });

            eventSource.onerror = (err) => {
                debug("❌ SSE ошибка. Проверь URL в index.html");
                updateStatus("Ошибка соединения с сервером");
            };
        }

        startBtn.addEventListener('click', () => {
            hasInteracted = true;
            startOverlay.classList.add('hidden');
            if (audio.src && audio.src !== window.location.href) playAudio();
        });

        function playAudio() {
            audio.play().then(() => {
                isPlaying = true;
                playBtn.innerText = '⏸️';
            }).catch(e => {
                debug("Play error: " + e.message);
                updateStatus("Ошибка: " + e.message);
            });
        }

        function pauseAudio() {
            audio.pause();
            isPlaying = false;
            playBtn.innerText = '▶️';
        }

        playBtn.addEventListener('click', () => { isPlaying ? pauseAudio() : playAudio(); });

        likeBtn.addEventListener('click', () => {
            likeBtn.classList.toggle('active');
            tg.sendData(JSON.stringify({ action: "like", track: currentTrackData }));
        });

        dislikeBtn.addEventListener('click', () => {
            updateStatus("👎 Пропускаем...");
            tg.sendData(JSON.stringify({ action: "dislike", track: currentTrackData }));
        });

        function loadNextTrack() {
            nextBtn.classList.add('loading');
            updateStatus("Загрузка следующего...");
            debug("Отправка get_next_track в бота...");
            tg.sendData(JSON.stringify({ action: "get_next_track" }));
        }

        nextBtn.addEventListener('click', () => { if (isPlaying) pauseAudio(); loadNextTrack(); });
        prevBtn.addEventListener('click', () => { updateStatus("Пока не поддерживается"); setTimeout(() => updateStatus(""), 2000); });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) progressBar.style.width = ((audio.currentTime / audio.duration) * 100) + '%';
        });

        audio.addEventListener('ended', () => {
            debug("Трек закончился, запрашиваем следующий");
            updateStatus("Загружаю следующий...");
            loadNextTrack();
        });

        audio.addEventListener('error', (e) => {
            debug("Audio error: " + (audio.error ? audio.error.code : 'unknown'));
            updateStatus("Ошибка загрузки аудио");
            nextBtn.classList.remove('loading');
        });

        function loadTrack(trackData, isNew = false) {
            currentTrackData = trackData;
            titleEl.innerText = trackData.title;
            artistEl.innerText = trackData.artist;

            if (isNew || audio.src !== trackData.file_url) {
                audio.src = trackData.file_url;
                progressBar.style.width = '0%';
                if (hasInteracted) setTimeout(() => playAudio(), 100);
            }

            nextBtn.classList.remove('loading');
            prevBtn.classList.remove('loading');
            updateStatus("");
        }

        const urlParams = new URLSearchParams(window.location.search);
        const dataParam = urlParams.get('data');
        const userIdParam = urlParams.get('user_id');

        debug("URL params: data=" + (dataParam ? "OK" : "НЕТ") + ", user_id=" + (userIdParam || "НЕТ"));

        if (dataParam) {
            try {
                let base64Fixed = dataParam.replace(/-/g, '+').replace(/_/g, '/');
                while (base64Fixed.length % 4) { base64Fixed += '='; }

                const jsonStr = atob(base64Fixed);
                debug("JSON расшифрован успешно");

                const trackData = JSON.parse(jsonStr);
                debug("Трек: " + trackData.artist + " - " + trackData.title);

                loadTrack(trackData);

                if (userIdParam) {
                    connectSSE(userIdParam);
                } else {
                    debug("⚠️ Нет user_id в URL!");
                }
            } catch (e) {
                debug("❌ КРИТИЧЕСКАЯ ОШИБКА: " + e.message);
                titleEl.innerText = "Ошибка загрузки";
                artistEl.innerText = "Проверь консоль или URL";
            }
        } else {
            titleEl.innerText = "Открой через бота";
            artistEl.innerText = "Нажми /start";
        }
    </script>
</body>
</html>
