<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QuasWave Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #1c1c1e);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .cover {
            width: 250px;
            height: 250px;
            background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
            border-radius: 20px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
        }
        .track-info { margin-bottom: 30px; }
        .track-title { font-size: 24px; font-weight: bold; margin-bottom: 8px; }
        .track-artist { font-size: 16px; opacity: 0.7; }
        .controls { display: flex; gap: 20px; align-items: center; }
        button {
            background: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        button:active { opacity: 0.8; }
        .loading { opacity: 0.5; pointer-events: none; }
        #startOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        #startOverlay.hidden { display: none; }
        #startBtn {
            padding: 20px 40px;
            font-size: 24px;
            background: #3390ec;
        }
    </style>
</head>
<body>
    <!-- Overlay для первого клика -->
    <div id="startOverlay">
        <div class="cover">🎵</div>
        <h2>Готов слушать?</h2>
        <button id="startBtn">▶️ Начать воспроизведение</button>
    </div>

    <div class="cover">🎵</div>
    <div class="track-info">
        <div class="track-title" id="title">Загрузка...</div>
        <div class="track-artist" id="artist">Подожди немного</div>
    </div>

    <audio id="audioPlayer" preload="auto"></audio>

    <div class="controls">
        <button id="prevBtn">⏮️ Пред.</button>
        <button id="nextBtn">След. ️</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const audio = document.getElementById('audioPlayer');
        const titleEl = document.getElementById('title');
        const artistEl = document.getElementById('artist');
        const nextBtn = document.getElementById('nextBtn');
        const startOverlay = document.getElementById('startOverlay');
        const startBtn = document.getElementById('startBtn');

        let currentTrackData = null;
        let hasInteracted = false;

        async function loadNextTrack() {
            nextBtn.classList.add('loading');
            nextBtn.innerText = 'Загрузка...';
            tg.sendData(JSON.stringify({ action: "get_next_track" }));
        }

        const urlParams = new URLSearchParams(window.location.search);
        const dataParam = urlParams.get('data');

        if (dataParam) {
            try {
                const trackData = JSON.parse(atob(dataParam));
                currentTrackData = trackData;
                titleEl.innerText = trackData.title;
                artistEl.innerText = trackData.artist;
                audio.src = trackData.file_url;
            } catch (e) {
                console.error("Ошибка парсинга данных", e);
            }
        } else {
            titleEl.innerText = "Нажми 'Включить волну'";
            artistEl.innerText = "в чате с ботом";
        }

        // ПЕРВЫЙ КЛИК - разблокируем автовоспроизведение
        startBtn.addEventListener('click', () => {
            hasInteracted = true;
            startOverlay.classList.add('hidden');

            if (audio.src) {
                audio.play().catch(e => {
                    console.error("Ошибка воспроизведения:", e);
                    titleEl.innerText = "Ошибка: " + e.message;
                });
            }
        });

        function playTrack(trackData) {
            currentTrackData = trackData;
            titleEl.innerText = trackData.title;
            artistEl.innerText = trackData.artist;
            audio.src = trackData.file_url;

            // Если уже было взаимодействие - играем сразу
            if (hasInteracted) {
                audio.play().catch(e => console.error("Autoplay error:", e));
            }

            nextBtn.classList.remove('loading');
            nextBtn.innerText = 'След. ⏭️';
        }

        audio.addEventListener('ended', () => {
            console.log("Трек закончился, грузим следующий...");
            loadNextTrack();
        });

        nextBtn.addEventListener('click', () => {
            audio.pause();
            loadNextTrack();
        });

        // Слушаем обновления от бота через Telegram Web App
        tg.onEvent('mainButtonClicked', () => {});
    </script>
</body>
</html>
