<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QuasWave Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #1c1c1e);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .cover {
            width: 250px;
            height: 250px;
            background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
            border-radius: 20px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
        }
        .track-info { margin-bottom: 30px; }
        .track-title { font-size: 24px; font-weight: bold; margin-bottom: 8px; }
        .track-artist { font-size: 16px; opacity: 0.7; }
        .controls { display: flex; gap: 20px; align-items: center; }
        button {
            background: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        button:active { opacity: 0.8; }
        .loading { opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body>
    <div class="cover">🎵</div>
    <div class="track-info">
        <div class="track-title" id="title">Загрузка...</div>
        <div class="track-artist" id="artist">Подожди немного</div>
    </div>

    <audio id="audioPlayer" preload="auto"></audio>

    <div class="controls">
        <button id="prevBtn">⏮️ Пред.</button>
        <button id="nextBtn">След. ⏭️</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Раскрываем на весь экран

        const audio = document.getElementById('audioPlayer');
        const titleEl = document.getElementById('title');
        const artistEl = document.getElementById('artist');
        const nextBtn = document.getElementById('nextBtn');

        let currentTrackData = null;

        // Функция запроса следующего трека у бота
        async function loadNextTrack() {
            nextBtn.classList.add('loading');
            nextBtn.innerText = 'Загрузка...';

            // Отправляем данные боту, чтобы он вернул новый трек
            // Мы используем sendData, а бот будет слушать это событие
            tg.sendData(JSON.stringify({ action: "get_next_track" }));
        }

        // Слушаем сообщения от бота (бот будет присылать данные трека через WebApp script или мы можем парсить start_param)
        // Для простоты: бот будет обновлять UI через tg.MainButton или мы сделаем хак с postMessage,
        // но самый надежный способ для Mini App без своего бэкенда - это стартовые параметры.

        // В ДАННОЙ РЕАЛИЗАЦИИ: Мы будем парсить URL.
        // Бот будет открывать WebApp с URL вида: https://твой-хостинг.com/?data=BASE64_JSON
        const urlParams = new URLSearchParams(window.location.search);
        const dataParam = urlParams.get('data');

        if (dataParam) {
            try {
                const trackData = JSON.parse(atob(dataParam));
                playTrack(trackData);
            } catch (e) {
                console.error("Ошибка парсинга данных", e);
            }
        } else {
            titleEl.innerText = "Нажми 'Включить волну'";
            artistEl.innerText = "в чате с ботом";
        }

        function playTrack(trackData) {
            currentTrackData = trackData;
            titleEl.innerText = trackData.title;
            artistEl.innerText = trackData.artist;

            audio.src = trackData.file_url;
            audio.play().catch(e => console.log("Autoplay blocked, waiting for interaction", e));

            nextBtn.classList.remove('loading');
            nextBtn.innerText = 'След. ⏭️';
        }

        // ГЛАВНАЯ МАГИЯ: Когда трек заканчивается, грузим следующий
        audio.addEventListener('ended', () => {
            console.log("Трек закончился, грузим следующий...");
            loadNextTrack();
        });

        nextBtn.addEventListener('click', () => {
            audio.pause();
            loadNextTrack();
        });

        // Слушаем обновления от бота (бот будет закрывать и переоткрывать WebApp с новыми данными,
        // или мы можем использовать более сложную схему с WebSocket, но для начала хватит перезапуска с новыми данными)
        tg.onEvent('mainButtonClicked', () => {
            // Резервный вариант
        });
    </script>
</body>
</html>
