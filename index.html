<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QuasWave Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(94, 70, 255, 0.38), transparent 32%),
                radial-gradient(circle at bottom right, rgba(0, 194, 255, 0.28), transparent 28%),
                #0b0f1a;
            color: #f5f7ff;
            display: flex;
            justify-content: center;
        }

        button {
            border: none;
            background: none;
            color: inherit;
            font: inherit;
            cursor: pointer;
        }

        .app {
            width: 100%;
            max-width: 520px;
            min-height: 100vh;
            padding: 20px 16px 28px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .logo {
            width: 46px;
            height: 46px;
            border-radius: 15px;
            background: linear-gradient(135deg, #7b52ff, #00c2ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 15px;
            flex: 0 0 auto;
            box-shadow:
                0 12px 32px rgba(0, 194, 255, 0.24),
                inset 0 1px 0 rgba(255, 255, 255, 0.22);
        }

        .brand-text {
            min-width: 0;
        }

        .brand-text h1 {
            font-size: 23px;
            line-height: 1.05;
            letter-spacing: 0.7px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .brand-text p {
            margin-top: 3px;
            font-size: 12px;
            color: #9aa4c7;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 0 0 auto;
        }

        .icon-btn {
            padding: 10px 12px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.09);
            font-size: 18px;
            line-height: 1;
            flex: 0 0 auto;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
            transition: transform 0.12s ease, background 0.18s ease;
        }

        .icon-btn:active {
            transform: scale(0.93);
        }

        .mode-label {
            padding: 12px 14px;
            border-radius: 17px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #d7deff;
            font-size: 14px;
            line-height: 1.35;
            overflow-wrap: anywhere;
            word-break: break-word;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .card {
            padding: 24px 16px 18px;
            border-radius: 28px;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 255, 255, 0.09);
            box-shadow:
                0 24px 70px rgba(0, 0, 0, 0.30),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .cover {
            position: relative;
            width: 182px;
            height: 182px;
            max-width: 100%;
            border-radius: 28px;
            overflow: hidden;
            background:
                radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.24), transparent 22%),
                linear-gradient(135deg, #6d4aff, #00c2ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            font-weight: 900;
            box-shadow:
                0 20px 55px rgba(0, 194, 255, 0.22),
                inset 0 1px 0 rgba(255, 255, 255, 0.22);
        }

        .cover-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .track-info {
            width: 100%;
            text-align: center;
            min-width: 0;
        }

        .track-title {
            font-size: 28px;
            font-weight: 900;
            line-height: 1.14;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .track-artist {
            margin-top: 8px;
            font-size: 18px;
            color: #aab4d8;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .progress {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .time-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            font-size: 13px;
            color: #9aa4c7;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #63e6ff;
            cursor: pointer;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .control-btn {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.07));
            border: 1px solid rgba(255, 255, 255, 0.10);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            line-height: 1;
            box-shadow:
                0 12px 28px rgba(0, 0, 0, 0.22),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
            transition: transform 0.12s ease, box-shadow 0.18s ease, background 0.18s ease;
        }

        .control-btn:active {
            transform: scale(0.91);
        }

        .control-btn.liked {
            background:
                linear-gradient(135deg, #ff4d67, #ff2e4d);
            box-shadow:
                0 14px 34px rgba(255, 46, 77, 0.34),
                inset 0 1px 0 rgba(255, 255, 255, 0.22);
        }

        .play-btn {
            width: 86px;
            height: 86px;
            font-size: 36px;
            background:
                linear-gradient(135deg, #7b52ff, #00c2ff);
            box-shadow:
                0 18px 45px rgba(0, 194, 255, 0.30),
                inset 0 1px 0 rgba(255, 255, 255, 0.24);
        }

        .volume-row {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 6px;
        }

        .volume-row input[type="range"] {
            flex: 1;
        }

        .footer-note {
            text-align: center;
            color: #7f89ad;
            font-size: 12px;
            line-height: 1.35;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.38);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 25;
        }

        .backdrop.show {
            opacity: 1;
            pointer-events: auto;
        }

        .likes-panel,
        .modes-panel {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            background: #101527;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transform: translateY(100%);
            transition: transform 0.24s ease;
            display: flex;
            flex-direction: column;
            box-shadow: 0 -20px 70px rgba(0, 0, 0, 0.4);
        }

        .likes-panel {
            height: 78vh;
            max-height: 78vh;
            z-index: 30;
        }

        .modes-panel {
            z-index: 35;
            max-height: 82vh;
        }

        .likes-panel.open,
        .modes-panel.open {
            transform: translateY(0);
        }

        .panel-header {
            padding: 16px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .panel-title {
            font-size: 20px;
            font-weight: 900;
        }

        .panel-subtitle {
            margin-top: 6px;
            font-size: 12px;
            color: #9aa4c7;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .likes-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            -webkit-overflow-scrolling: touch;
        }

        .like-item,
        .mode-option {
            width: 100%;
            text-align: left;
            padding: 13px 14px;
            margin-bottom: 9px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.07);
            cursor: pointer;
            overflow-wrap: anywhere;
            word-break: break-word;
            line-height: 1.35;
            transition: transform 0.12s ease, background 0.18s ease;
        }

        .like-item:active,
        .mode-option:active {
            transform: scale(0.98);
            background: rgba(255, 255, 255, 0.10);
        }

        .like-item:last-child,
        .mode-option:last-child {
            margin-bottom: 0;
        }

        .modes-body {
            padding: 12px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .checkbox-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 13px 14px;
            margin-bottom: 9px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.07);
            line-height: 1.35;
        }

        .checkbox-row input {
            width: 18px;
            height: 18px;
            margin-top: 1px;
            accent-color: #63e6ff;
            flex: 0 0 auto;
        }

        .loading {
            position: fixed;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%) translateY(16px);
            padding: 9px 14px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.62);
            color: #fff;
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.18s ease, transform 0.18s ease;
            z-index: 50;
        }

        .loading.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast {
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%) translateY(-18px);
            max-width: calc(100vw - 24px);
            padding: 10px 14px;
            border-radius: 14px;
            background: rgba(15, 18, 30, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 14px;
            line-height: 1.3;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.18s ease, transform 0.18s ease;
            z-index: 60;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <div class="brand">
                <div class="logo">QW</div>
                <div class="brand-text">
                    <h1>QUASWAVE</h1>
                    <p>волна last.fm</p>
                </div>
            </div>

            <div class="header-actions">
                <button id="openModesBtn" class="icon-btn" title="Режимы">🧭</button>
                <button id="openLikesBtn" class="icon-btn" title="Лайки">❤️</button>
            </div>
        </div>

        <div id="modeLabel" class="mode-label">🎵 Волна QuasWave</div>

        <div class="card">
            <div class="cover">
                <img id="coverImg" class="cover-img" alt="cover">
                <span id="coverPlaceholder">QW</span>
            </div>

            <div class="track-info">
                <div id="trackTitle" class="track-title">Готов слушать?</div>
                <div id="trackArtist" class="track-artist">QuasWave</div>
            </div>

            <div class="progress">
                <div class="time-row">
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                </div>
                <input id="seek" type="range" min="0" max="0" step="1" value="0">
            </div>

            <div class="controls">
                <button id="likeBtn" class="control-btn" title="Лайк">👍</button>
                <button id="playBtn" class="control-btn play-btn" title="Play/Pause">▶</button>
                <button id="nextBtn" class="control-btn" title="Следующий">⏭</button>
                <button id="dislikeBtn" class="control-btn" title="Дизлайк">👎</button>
            </div>

            <div class="volume-row">
                <button id="muteBtn" class="icon-btn" title="Звук">🔊</button>
                <input id="volume" type="range" min="0" max="1" step="0.01" value="1">
            </div>
        </div>

        <div class="footer-note">
            Выбор трека из ❤️-лайков запускает плейлист из лайков.
            Кнопка 🧭 переключает волны без бота.
        </div>
    </div>

    <div id="backdrop" class="backdrop"></div>

    <div id="likesPanel" class="likes-panel">
        <div class="panel-header">
            <div>
                <div class="panel-title">❤️ Лайки</div>
                <div id="likesUser" class="panel-subtitle">user_id: ...</div>
            </div>
            <button id="closeLikesBtn" class="icon-btn" title="Закрыть">✖️</button>
        </div>
        <div id="likesList" class="likes-list"></div>
    </div>

    <div id="modesPanel" class="modes-panel">
        <div class="panel-header">
            <div>
                <div class="panel-title">🧭 Режимы волны</div>
                <div class="panel-subtitle">Переключение без возврата в бота</div>
            </div>
            <button id="closeModesBtn" class="icon-btn" title="Закрыть">✖️</button>
        </div>

        <div class="modes-body">
            <button id="previousWaveBtn" class="mode-option" style="display:none;">↩️ Вернуться к прошлой волне</button>
            <button id="modeTrackBtn" class="mode-option">🎶 Волна по конкретному треку</button>
            <button id="modeLikesBtn" class="mode-option">❤️ Волна по лайкам</button>
            <button id="modePlaylistBtn" class="mode-option">❤️ Плейлист из лайков</button>
            <button id="modeArtistBtn" class="mode-option">🎤 Волна по исполнителю</button>
            <button id="modeGlobalBtn" class="mode-option">🌍 Глобальная волна</button>

            <label class="checkbox-row">
                <input id="globalUseLikes" type="checkbox">
                <span>Учитывать мои последние 10 лайков для формирования глобальной волны</span>
            </label>
        </div>
    </div>

    <div id="loading" class="loading">Загрузка...</div>
    <div id="toast" class="toast"></div>

    <audio id="audio" preload="auto"></audio>

    <script>
        const APP_VERSION = "20260801-12";

        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;

        if (tg) {
            try {
                tg.ready();
                tg.expand();

                if (tg.setHeaderColor) {
                    tg.setHeaderColor("#0b0f1a");
                }
            } catch (e) {
                console.error("Telegram WebApp init failed", e);
            }
        }

        const params = new URLSearchParams(window.location.search);

        function b64ToUtf8(base64) {
            const binary = atob(base64);
            const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
            return new TextDecoder().decode(bytes);
        }

        function decodeB64UrlSafe(value) {
            if (!value) {
                return "";
            }

            let base64 = value.replace(/-/g, "+").replace(/_/g, "/");

            while (base64.length % 4) {
                base64 += "=";
            }

            return b64ToUtf8(base64);
        }

        let initialData = {};

        try {
            const rawData = params.get("data");

            if (rawData) {
                initialData = JSON.parse(decodeB64UrlSafe(rawData));
            }
        } catch (e) {
            console.error("Cannot parse initial data", e);
        }

        let apiBase = "https://differences-terminal-identical-egg.trycloudflare.com";

        try {
            const apiParam = params.get("api_base");

            if (apiParam) {
                apiBase = decodeB64UrlSafe(apiParam);
            }
        } catch (e) {
            console.error("Cannot parse api_base", e);
        }

        apiBase = (apiBase || "").replace(/\/+$/g, "");

        function firstDefined(...values) {
            for (const value of values) {
                if (value !== undefined && value !== null && String(value).length > 0) {
                    return String(value);
                }
            }

            return "";
        }

        const tgUserId = tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id
            ? String(tg.initDataUnsafe.user.id)
            : "";

        const state = {
            userId: firstDefined(tgUserId, initialData.user_id, params.get("user_id"), "0"),
            artist: initialData.artist || "",
            title: initialData.title || initialData.track || "",
            fileUrl: initialData.file_url || "",
            coverUrl: initialData.cover_url || "",
            mode: initialData.mode || "",
            seedArtist: initialData.seed_artist || "",
            seedTrack: initialData.seed_track || "",
            liked: !!initialData.liked,
            globalUseLikes: false,
            previousWave: null,
            likesPage: 1,
            likesPages: 1,
            likesLoading: false,
            likesLoaded: false,
            nextLoading: false
        };

        const audio = document.getElementById("audio");
        const trackTitle = document.getElementById("trackTitle");
        const trackArtist = document.getElementById("trackArtist");
        const modeLabel = document.getElementById("modeLabel");
        const currentTime = document.getElementById("currentTime");
        const duration = document.getElementById("duration");
        const seek = document.getElementById("seek");
        const playBtn = document.getElementById("playBtn");
        const nextBtn = document.getElementById("nextBtn");
        const likeBtn = document.getElementById("likeBtn");
        const dislikeBtn = document.getElementById("dislikeBtn");
        const muteBtn = document.getElementById("muteBtn");
        const volumeInput = document.getElementById("volume");
        const coverImg = document.getElementById("coverImg");
        const coverPlaceholder = document.getElementById("coverPlaceholder");

        const openLikesBtn = document.getElementById("openLikesBtn");
        const closeLikesBtn = document.getElementById("closeLikesBtn");
        const likesPanel = document.getElementById("likesPanel");
        const backdrop = document.getElementById("backdrop");
        const likesList = document.getElementById("likesList");
        const likesUser = document.getElementById("likesUser");

        const openModesBtn = document.getElementById("openModesBtn");
        const closeModesBtn = document.getElementById("closeModesBtn");
        const modesPanel = document.getElementById("modesPanel");
        const previousWaveBtn = document.getElementById("previousWaveBtn");
        const modeTrackBtn = document.getElementById("modeTrackBtn");
        const modeLikesBtn = document.getElementById("modeLikesBtn");
        const modePlaylistBtn = document.getElementById("modePlaylistBtn");
        const modeArtistBtn = document.getElementById("modeArtistBtn");
        const modeGlobalBtn = document.getElementById("modeGlobalBtn");
        const globalUseLikes = document.getElementById("globalUseLikes");

        const loading = document.getElementById("loading");
        const toast = document.getElementById("toast");

        let toastTimer = null;

        function haptic(style) {
            try {
                if (tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred) {
                    tg.HapticFeedback.impactOccurred(style || "light");
                }
            } catch (e) {
                console.error("Haptic failed", e);
            }
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add("show");

            if (toastTimer) {
                clearTimeout(toastTimer);
            }

            toastTimer = setTimeout(() => {
                toast.classList.remove("show");
            }, 2600);
        }

        function setLoading(on) {
            loading.classList.toggle("show", !!on);
        }

        function formatTime(seconds) {
            if (!isFinite(seconds) || seconds < 0) {
                return "0:00";
            }

            const total = Math.floor(seconds);
            const minutes = Math.floor(total / 60);
            const rest = total % 60;

            return minutes + ":" + String(rest).padStart(2, "0");
        }

        function modeTitle(mode) {
            if (mode === "likes") return "❤️ волна по лайкам";
            if (mode === "likes_playlist") return "❤️ плейлист из лайков";
            if (mode === "artist") return "🎤 волна по исполнителю";
            if (mode === "global") return "🌍 глобальная волна";
            return "🎶 волна по треку";
        }

        function updateModeLabel() {
            let text = "🎵 Волна QuasWave";

            if (state.mode === "likes") {
                text = "❤️ Волна по лайкам";
            } else if (state.mode === "likes_playlist") {
                text = "❤️ Плейлист из лайков";
            } else if (state.mode === "artist") {
                text = "🎤 Волна по исполнителю: " + (state.seedArtist || state.artist || "");
            } else if (state.mode === "global") {
                text = "🌍 Глобальная волна" + (state.globalUseLikes ? " + мои лайки" : "");
            } else if (state.mode === "track") {
                text = "🎶 Волна по треку: " + (state.seedArtist || state.artist || "") + " — " + (state.seedTrack || state.title || "");
            } else if (state.artist && state.title) {
                text = "🎶 Волна по треку: " + state.artist + " — " + state.title;
            }

            modeLabel.textContent = text;
        }

        function updateTrackInfo() {
            trackTitle.textContent = state.title || "Готов слушать?";
            trackArtist.textContent = state.artist || "QuasWave";

            if (state.artist && state.title) {
                document.title = state.artist + " - " + state.title + " | QuasWave";
            } else {
                document.title = "QuasWave Player";
            }

            updateModeLabel();
        }

        function updateCover() {
            if (state.coverUrl) {
                coverImg.src = state.coverUrl;
                coverImg.style.display = "block";
                coverPlaceholder.style.display = "none";
            } else {
                coverImg.removeAttribute("src");
                coverImg.style.display = "none";
                coverPlaceholder.style.display = "block";
            }
        }

        function updateLikeBtn() {
            likeBtn.classList.toggle("liked", !!state.liked);
        }

        function updatePlayIcon() {
            playBtn.textContent = audio.paused ? "▶" : "⏸";
        }

        function updateVolumeIcon() {
            if (audio.muted || audio.volume <= 0.001) {
                muteBtn.textContent = "🔇";
            } else if (audio.volume < 0.5) {
                muteBtn.textContent = "🔉";
            } else {
                muteBtn.textContent = "🔊";
            }
        }

        function canShowPreviousWave() {
            const prev = state.previousWave;

            if (!prev || !prev.mode) {
                return false;
            }

            if (prev.mode === "track") {
                return !!(prev.seedArtist && prev.seedTrack);
            }

            if (prev.mode === "artist") {
                return !!prev.seedArtist;
            }

            return true;
        }

        function updateModesPanel() {
            globalUseLikes.checked = !!state.globalUseLikes;

            if (canShowPreviousWave()) {
                previousWaveBtn.style.display = "block";
                previousWaveBtn.textContent = "↩️ Вернуться: " + modeTitle(state.previousWave.mode);
            } else {
                previousWaveBtn.style.display = "none";
            }
        }

        function applyTrackData(data) {
            if (!data) {
                return;
            }

            const newMode = data.mode || state.mode;

            if (newMode && state.mode && newMode !== state.mode) {
                state.previousWave = {
                    mode: state.mode,
                    seedArtist: state.seedArtist,
                    seedTrack: state.seedTrack,
                    artist: state.artist,
                    title: state.title
                };
            }

            if (data.artist) {
                state.artist = data.artist;
            }

            if (data.title) {
                state.title = data.title;
            }

            if (data.file_url) {
                state.fileUrl = data.file_url;
            }

            if (data.mode) {
                state.mode = data.mode;
            }

            if (data.seed_artist !== undefined && data.seed_artist !== null && data.seed_artist !== "") {
                state.seedArtist = data.seed_artist;
            }

            if (data.seed_track !== undefined && data.seed_track !== null && data.seed_track !== "") {
                state.seedTrack = data.seed_track;
            }

            if (data.cover_url !== undefined) {
                state.coverUrl = data.cover_url || "";
            }

            if (data.liked !== undefined) {
                state.liked = !!data.liked;
            }

            if (state.mode === "track") {
                if (!state.seedArtist && state.artist) {
                    state.seedArtist = state.artist;
                }

                if (!state.seedTrack && state.title) {
                    state.seedTrack = state.title;
                }
            }

            updateTrackInfo();
            updateCover();
            updateLikeBtn();
            updateModesPanel();

            if (state.fileUrl) {
                audio.src = state.fileUrl;
                audio.load();
            }
        }

        async function apiFetch(path, options) {
            options = options || {};

            const headers = Object.assign({}, options.headers || {});

            if (tg && tg.initData) {
                headers["X-Telegram-Init-Data"] = tg.initData;
            }

            const fetchOptions = {
                method: options.method || "GET",
                cache: "no-store",
                headers: headers
            };

            if (options.json !== undefined) {
                headers["Content-Type"] = "application/json";
                fetchOptions.body = JSON.stringify(options.json);
            }

            const url = apiBase + path;
            const response = await fetch(url, fetchOptions);

            if (!response.ok) {
                let message = "HTTP " + response.status;

                try {
                    const data = await response.json();

                    if (data && data.error) {
                        message = data.error;
                    }
                } catch (e) {
                    console.error("Cannot parse error response", e);
                }

                throw new Error(message);
            }

            return response.json();
        }

        function withUser(path) {
            const separator = path.includes("?") ? "&" : "?";
            return path + separator + "user_id=" + encodeURIComponent(state.userId);
        }

        function buildNextPath() {
            const query = new URLSearchParams();

            query.set("user_id", state.userId);

            if (state.mode) {
                query.set("mode", state.mode);
            }

            if (state.seedArtist) {
                query.set("artist", state.seedArtist);
            }

            if (state.seedTrack) {
                query.set("track", state.seedTrack);
            }

            return "/api/next_track?" + query.toString();
        }

        async function playAudio() {
            try {
                await audio.play();
            } catch (e) {
                console.error("Play failed", e);
                showToast("Не удалось воспроизвести");
            }
        }

        async function ensureInitialAndPlay() {
            setLoading(true);

            try {
                if (state.fileUrl) {
                    updatePlayIcon();
                    await playAudio();
                    return;
                }

                await requestNext(true);
            } finally {
                setLoading(false);
            }
        }

        async function requestNext(autoplay) {
            if (state.nextLoading) {
                return;
            }

            state.nextLoading = true;
            setLoading(true);

            try {
                const data = await apiFetch(buildNextPath());

                applyTrackData(data);

                if (autoplay) {
                    await playAudio();
                }
            } catch (e) {
                console.error("Next track failed", e);
                showToast(e.message || "Ошибка загрузки");
            } finally {
                state.nextLoading = false;
                setLoading(false);
                updatePlayIcon();
            }
        }

        async function startTrack(artist, track, autoplay) {
            setLoading(true);

            try {
                const data = await apiFetch(withUser("/api/start_track"), {
                    method: "POST",
                    json: {
                        artist: artist,
                        track: track
                    }
                });

                applyTrackData(data);

                if (autoplay) {
                    await playAudio();
                }
            } catch (e) {
                console.error("Start track failed", e);
                showToast(e.message || "Не удалось запустить трек");
            } finally {
                setLoading(false);
                updatePlayIcon();
            }
        }

        async function startLikedPlaylist(artist, track, autoplay) {
            setLoading(true);

            try {
                const data = await apiFetch(withUser("/api/start_liked_playlist"), {
                    method: "POST",
                    json: {
                        artist: artist || "",
                        track: track || ""
                    }
                });

                applyTrackData(data);

                if (autoplay) {
                    await playAudio();
                }
            } catch (e) {
                console.error("Start liked playlist failed", e);
                showToast(e.message || "Не удалось запустить плейлист из лайков");
            } finally {
                setLoading(false);
                updatePlayIcon();
            }
        }

        async function startArtist(artist) {
            setLoading(true);

            try {
                const data = await apiFetch(withUser("/api/start_artist"), {
                    method: "POST",
                    json: {
                        artist: artist
                    }
                });

                applyTrackData(data);
                await playAudio();
            } catch (e) {
                console.error("Start artist failed", e);
                showToast(e.message || "Не удалось запустить волну по исполнителю");
            } finally {
                setLoading(false);
                updatePlayIcon();
            }
        }

        async function startLikesWave() {
            setLoading(true);

            try {
                const data = await apiFetch(withUser("/api/start_likes_wave"), {
                    method: "POST",
                    json: {}
                });

                applyTrackData(data);
                await playAudio();
            } catch (e) {
                console.error("Start likes wave failed", e);
                showToast(e.message || "Не удалось запустить волну по лайкам");
            } finally {
                setLoading(false);
                updatePlayIcon();
            }
        }

        async function startGlobalWave() {
            setLoading(true);

            try {
                const data = await apiFetch(withUser("/api/start_global_wave"), {
                    method: "POST",
                    json: {}
                });

                applyTrackData(data);
                await playAudio();
            } catch (e) {
                console.error("Start global wave failed", e);
                showToast(e.message || "Не удалось запустить глобальную волну");
            } finally {
                setLoading(false);
                updatePlayIcon();
            }
        }

        async function startPreviousWave() {
            const prev = state.previousWave;

            if (!prev || !canShowPreviousWave()) {
                showToast("Нет предыдущей волны");
                return;
            }

            closeModes();

            if (prev.mode === "track") {
                await startTrack(prev.seedArtist, prev.seedTrack, true);
            } else if (prev.mode === "artist") {
                await startArtist(prev.seedArtist);
            } else if (prev.mode === "likes") {
                await startLikesWave();
            } else if (prev.mode === "likes_playlist") {
                await startLikedPlaylist("", "", true);
            } else if (prev.mode === "global") {
                await startGlobalWave();
            } else {
                showToast("Не знаю, куда возвращать");
            }
        }

        async function likeCurrent() {
            if (!state.artist || !state.title) {
                showToast("Сначала запусти трек");
                return;
            }

            try {
                await apiFetch(withUser("/api/like"), {
                    method: "POST",
                    json: {
                        artist: state.artist,
                        track: state.title
                    }
                });

                state.liked = true;
                updateLikeBtn();

                haptic("medium");
                showToast("Лайк сохранён");

                state.likesLoaded = false;

                if (likesPanel.classList.contains("open")) {
                    loadLikes(true);
                }
            } catch (e) {
                console.error("Like failed", e);
                showToast(e.message || "Ошибка лайка");
            }
        }

        async function dislikeCurrent() {
            if (!state.artist || !state.title) {
                await requestNext(true);
                return;
            }

            setLoading(true);

            try {
                await apiFetch(withUser("/api/dislike"), {
                    method: "POST",
                    json: {
                        artist: state.artist,
                        track: state.title
                    }
                });

                state.liked = false;
                updateLikeBtn();

                haptic("heavy");
                showToast("Дизлайк учтён");

                state.likesLoaded = false;

                await requestNext(true);
            } catch (e) {
                console.error("Dislike failed", e);
                showToast(e.message || "Ошибка дизлайка");
                setLoading(false);
            }
        }

        playBtn.addEventListener("click", async () => {
            haptic("light");

            if (!audio.src) {
                await ensureInitialAndPlay();
                return;
            }

            if (audio.paused) {
                await playAudio();
            } else {
                audio.pause();
            }

            updatePlayIcon();
        });

        nextBtn.addEventListener("click", () => {
            haptic("light");
            requestNext(true);
        });

        likeBtn.addEventListener("click", likeCurrent);
        dislikeBtn.addEventListener("click", dislikeCurrent);

        muteBtn.addEventListener("click", () => {
            audio.muted = !audio.muted;

            if (!audio.muted && audio.volume <= 0.001) {
                audio.volume = 0.7;
                volumeInput.value = "0.7";
            }

            updateVolumeIcon();
            haptic("light");
        });

        volumeInput.addEventListener("input", () => {
            audio.volume = Number(volumeInput.value || 0);
            audio.muted = false;
            updateVolumeIcon();
        });

        audio.addEventListener("play", updatePlayIcon);
        audio.addEventListener("pause", updatePlayIcon);
        audio.addEventListener("volumechange", updateVolumeIcon);

        audio.addEventListener("timeupdate", () => {
            if (isFinite(audio.duration) && audio.duration > 0) {
                seek.max = Math.floor(audio.duration);
                seek.value = Math.floor(audio.currentTime);
                currentTime.textContent = formatTime(audio.currentTime);
                duration.textContent = formatTime(audio.duration);
            }
        });

        audio.addEventListener("loadedmetadata", () => {
            if (isFinite(audio.duration)) {
                seek.max = Math.floor(audio.duration);
                duration.textContent = formatTime(audio.duration);
            }
        });

        audio.addEventListener("ended", () => {
            requestNext(true);
        });

        audio.addEventListener("error", () => {
            if (audio.src) {
                showToast("Ошибка аудио. Попробуй следующий трек.");
            }

            updatePlayIcon();
        });

        coverImg.addEventListener("error", () => {
            state.coverUrl = "";
            updateCover();
        });

        seek.addEventListener("input", () => {
            if (isFinite(audio.duration) && audio.duration > 0 && seek.max) {
                audio.currentTime = (Number(seek.value) / Number(seek.max)) * audio.duration;
                currentTime.textContent = formatTime(audio.currentTime);
            }
        });

        function openLikes() {
            closeModes();
            likesPanel.classList.add("open");
            backdrop.classList.add("show");
            likesUser.textContent = "user_id: " + state.userId;

            if (!state.likesLoaded) {
                loadLikes(true);
            }
        }

        function closeLikes() {
            likesPanel.classList.remove("open");

            if (!modesPanel.classList.contains("open")) {
                backdrop.classList.remove("show");
            }
        }

        function openModes() {
            closeLikes();
            updateModesPanel();
            modesPanel.classList.add("open");
            backdrop.classList.add("show");
        }

        function closeModes() {
            modesPanel.classList.remove("open");

            if (!likesPanel.classList.contains("open")) {
                backdrop.classList.remove("show");
            }
        }

        openLikesBtn.addEventListener("click", openLikes);
        closeLikesBtn.addEventListener("click", closeLikes);
        backdrop.addEventListener("click", () => {
            closeLikes();
            closeModes();
        });

        openModesBtn.addEventListener("click", openModes);
        closeModesBtn.addEventListener("click", closeModes);

        previousWaveBtn.addEventListener("click", startPreviousWave);

        modeTrackBtn.addEventListener("click", () => {
            const input = window.prompt("Введи трек в формате: Артист - Трек");

            if (!input) {
                return;
            }

            let artist = "";
            let track = "";

            if (input.includes(" - ")) {
                const parts = input.split(" - ");
                artist = parts[0].trim();
                track = parts[1].trim();
            } else if (input.includes(" — ")) {
                const parts = input.split(" — ");
                artist = parts[0].trim();
                track = parts[1].trim();
            }

            if (!artist || !track) {
                showToast("Нужен формат: Артист - Трек");
                return;
            }

            closeModes();
            startTrack(artist, track, true);
        });

        modeLikesBtn.addEventListener("click", () => {
            closeModes();
            startLikesWave();
        });

        modePlaylistBtn.addEventListener("click", () => {
            closeModes();
            startLikedPlaylist("", "", true);
        });

        modeArtistBtn.addEventListener("click", () => {
            const artist = window.prompt("Введи исполнителя");

            if (!artist || !artist.trim()) {
                return;
            }

            closeModes();
            startArtist(artist.trim());
        });

        modeGlobalBtn.addEventListener("click", () => {
            closeModes();
            startGlobalWave();
        });

        globalUseLikes.addEventListener("change", async () => {
            const checked = !!globalUseLikes.checked;

            try {
                await apiFetch(withUser("/api/settings"), {
                    method: "POST",
                    json: {
                        global_use_likes: checked
                    }
                });

                state.globalUseLikes = checked;
                updateModeLabel();
                updateModesPanel();

                showToast(checked ? "Глобальная волна будет учитывать твои лайки" : "Глобальная волна без твоих лайков");
            } catch (e) {
                console.error("Settings failed", e);
                showToast(e.message || "Не удалось сохранить настройку");
                globalUseLikes.checked = state.globalUseLikes;
            }
        });

        async function loadLikes(reset) {
            if (state.likesLoading) {
                return;
            }

            if (reset) {
                state.likesPage = 1;
                state.likesPages = 1;
                state.likesLoaded = false;
                likesList.innerHTML = "";
            }

            if (state.likesLoaded && state.likesPage > state.likesPages) {
                return;
            }

            state.likesLoading = true;

            try {
                const data = await apiFetch(
                    withUser("/api/likes?page=" + encodeURIComponent(state.likesPage) + "&page_size=15")
                );

                if (reset) {
                    likesList.innerHTML = "";
                }

                state.likesPage = data.page;
                state.likesPages = data.pages;

                likesUser.textContent = "user_id: " + data.user_id + " • всего " + data.total;

                (data.items || []).forEach((item) => {
                    const row = document.createElement("div");
                    row.className = "like-item";
                    row.textContent = item.artist + " — " + item.track;

                    row.addEventListener("click", () => {
                        haptic("light");
                        closeLikes();
                        startLikedPlaylist(item.artist, item.track, true);
                    });

                    likesList.appendChild(row);
                });

                if (state.likesPage >= state.likesPages) {
                    state.likesLoaded = true;
                } else {
                    state.likesPage += 1;
                }
            } catch (e) {
                console.error("Likes load failed", e);
                showToast(e.message || "Не удалось загрузить лайки");
            } finally {
                state.likesLoading = false;
            }
        }

        likesList.addEventListener("scroll", () => {
            if (state.likesLoaded || state.likesLoading) {
                return;
            }

            if (likesList.scrollTop + likesList.clientHeight >= likesList.scrollHeight - 120) {
                loadLikes(false);
            }
        });

        async function loadState() {
            try {
                const data = await apiFetch(withUser("/api/state"));

                state.globalUseLikes = !!data.global_use_likes;
                globalUseLikes.checked = state.globalUseLikes;

                if (!state.mode && data.mode) {
                    state.mode = data.mode;
                    state.seedArtist = data.seed_artist || state.seedArtist;
                    state.seedTrack = data.seed_track || state.seedTrack;
                }

                if (
                    data.current_artist &&
                    data.current_title &&
                    data.current_artist === state.artist &&
                    data.current_title === state.title
                ) {
                    state.liked = !!data.liked;
                    updateLikeBtn();
                }

                updateTrackInfo();
                updateModesPanel();
            } catch (e) {
                console.error("Load state failed", e);
            }
        }

        if (initialData && initialData.artist && (initialData.title || initialData.track)) {
            applyTrackData({
                artist: initialData.artist,
                title: initialData.title || initialData.track,
                file_url: initialData.file_url,
                cover_url: initialData.cover_url,
                mode: initialData.mode,
                seed_artist: initialData.seed_artist,
                seed_track: initialData.seed_track,
                liked: initialData.liked
            });
        } else {
            updateTrackInfo();
            updateCover();
            updateLikeBtn();
            updateModesPanel();
        }

        audio.volume = 1;
        volumeInput.value = "1";
        updateVolumeIcon();
        updatePlayIcon();

        loadState();
    </script>
</body>
</html>
