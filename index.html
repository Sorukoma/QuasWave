<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QuasWave Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }
        .cover {
            width: min(280px, 80vw);
            height: min(280px, 80vw);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 100px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .track-info { text-align: center; margin-bottom: 30px; width: 100%; padding: 0 20px; }
        .track-title { font-size: clamp(18px, 5vw, 26px); font-weight: bold; margin-bottom: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .track-artist { font-size: clamp(14px, 4vw, 18px); opacity: 0.7; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .progress-bar { width: 100%; max-width: 400px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; margin-bottom: 30px; overflow: hidden; }
        .progress { height: 100%; background: #667eea; width: 0%; transition: width 0.1s; }
        .controls { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; align-items: center; justify-items: center; width: 100%; max-width: 400px; padding: 0 10px; }
        button {
            background: rgba(255,255,255,0.1); color: #ffffff; border: none;
            padding: 12px; border-radius: 50%; font-size: 20px; font-weight: bold;
            cursor: pointer; transition: all 0.2s; backdrop-filter: blur(10px);
            width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
        }
        button:active { transform: scale(0.9); background: rgba(255,255,255,0.2); }
        button.like { background: rgba(46, 204, 113, 0.3); }
        button.like.active { background: #2ecc71; }
        button.dislike { background: rgba(231, 76, 60, 0.3); }
        button.play { background: #667eea; width: 70px; height: 70px; font-size: 28px; }
        .loading { opacity: 0.5; pointer-events: none; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 0.3; } }
        #startOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 1000;
        }
        #startOverlay.hidden { display: none; }
        .status { margin-top: 20px; font-size: 14px; opacity: 0.7; min-height: 20px; text-align: center; color: #ff6b6b; }
    </style>
</head>
<body>
    <div id="startOverlay">
        <div class="cover">🎵</div>
        <h2 style="margin: 20px 0;">Готов слушать?</h2>
        <button id="startBtn" style="padding: 20px 40px; font-size: 24px; background: #667eea; width: auto; height: auto; border-radius: 50px;">▶️ Начать</button>
    </div>

    <div class="cover">🎵</div>
    <div class="track-info">
        <div class="track-title" id="title">Загрузка...</div>
        <div class="track-artist" id="artist">Подожди немного</div>
    </div>
    <div class="progress-bar"><div class="progress" id="progressBar"></div></div>
    <audio id="audioPlayer" preload="auto"></audio>

    <div class="controls">
        <button id="likeBtn" class="like">👍</button>
        <button id="prevBtn">️</button>
        <button id="playBtn" class="play">▶️</button>
        <button id="nextBtn">⏭️</button>
        <button id="dislikeBtn" class="dislike">👎</button>
    </div>
    <div class="status" id="status"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const audio = document.getElementById('audioPlayer');
        const titleEl = document.getElementById('title');
        const artistEl = document.getElementById('artist');
        const progressBar = document.getElementById('progressBar');
        const playBtn = document.getElementById('playBtn');
        const nextBtn = document.getElementById('nextBtn');
        const prevBtn = document.getElementById('prevBtn');
        const likeBtn = document.getElementById('likeBtn');
        const dislikeBtn = document.getElementById('dislikeBtn');
        const startOverlay = document.getElementById('startOverlay');
        const startBtn = document.getElementById('startBtn');
        const statusEl = document.getElementById('status');

        let currentTrackData = null;
        let hasInteracted = false;
        let isPlaying = false;
        let userId = null;

        // !!! ВСТАВЬ СЮДА СВОЙ URL !!!
        const API_URL = "https://differences-terminal-identical-egg.trycloudflare.com";

        function updateStatus(text) { statusEl.innerText = text; }

        // Запрос следующего трека через HTTP API
        async function loadNextTrack() {
            nextBtn.classList.add('loading');
            updateStatus("Загрузка следующего...");
            console.log("Запрос к API:", `${API_URL}/api/next_track?user_id=${userId}`);

            try {
                const response = await fetch(`${API_URL}/api/next_track?user_id=${userId}`);
                console.log("Status:", response.status);

                const trackData = await response.json();
                console.log("Получены данные:", trackData);

                if (trackData.error) {
                    updateStatus("Ошибка: " + trackData.error);
                } else {
                    console.log("Вызов loadTrack...");
                    loadTrack(trackData, true);
                }
            } catch (e) {
                console.error("Fetch error:", e);
                updateStatus("Ошибка сети: " + e.message);
            }

            nextBtn.classList.remove('loading');
        }

        // Лайк трека
        async function likeTrack() {
            try {
                await fetch(`${API_URL}/api/like?user_id=${userId}`, { method: 'POST' });
                updateStatus("👍 Добавлено в лайки!");
                setTimeout(() => updateStatus(""), 2000);
            } catch (e) {
                console.error("Like error:", e);
            }
        }

        // Дизлайк трека
        async function dislikeTrack() {
            updateStatus("👎 Пропускаем...");
            await loadNextTrack();
        }

        startBtn.addEventListener('click', () => {
            hasInteracted = true;
            startOverlay.classList.add('hidden');
            if (audio.src && audio.src !== window.location.href) playAudio();
        });

        function playAudio() {
            audio.play().then(() => {
                isPlaying = true;
                playBtn.innerText = '⏸️';
            }).catch(e => {
                console.error("Play error:", e);
                updateStatus("Ошибка: " + e.message);
            });
        }

        function pauseAudio() {
            audio.pause();
            isPlaying = false;
            playBtn.innerText = '▶️';
        }

        playBtn.addEventListener('click', () => { isPlaying ? pauseAudio() : playAudio(); });
        likeBtn.addEventListener('click', likeTrack);
        dislikeBtn.addEventListener('click', dislikeTrack);
        nextBtn.addEventListener('click', () => { if (isPlaying) pauseAudio(); loadNextTrack(); });
        prevBtn.addEventListener('click', () => { updateStatus("Пока не поддерживается"); setTimeout(() => updateStatus(""), 2000); });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) progressBar.style.width = ((audio.currentTime / audio.duration) * 100) + '%';
        });

        audio.addEventListener('ended', () => {
            console.log("Трек закончился");
            updateStatus("Загружаю следующий...");
            loadNextTrack();
        });

        audio.addEventListener('error', (e) => {
            console.error("Audio error:", e);
            updateStatus("Ошибка загрузки аудио");
            nextBtn.classList.remove('loading');
        });

        function loadTrack(trackData, isNew = false) {
            currentTrackData = trackData;
            titleEl.innerText = trackData.title;
            artistEl.innerText = trackData.artist;

            // Добавляем timestamp чтобы браузер не кэшировал
            const cacheBuster = `?t=${Date.now()}`;
            const newSrc = trackData.file_url + cacheBuster;

            if (isNew || audio.src !== newSrc) {
                console.log("Загрузка нового трека:", trackData.title);

                // Останавливаем текущее воспроизведение
                audio.pause();
                audio.src = '';
                audio.load();

                // Устанавливаем новый источник
                audio.src = newSrc;
                progressBar.style.width = '0%';

                // Автовоспроизведение если было взаимодействие
                if (hasInteracted) {
                    console.log("Автовоспроизведение...");
                    setTimeout(() => {
                        audio.play().then(() => {
                            isPlaying = true;
                            playBtn.innerText = '⏸️';
                            updateStatus("");
                        }).catch(err => {
                            console.error("Autoplay error:", err);
                            updateStatus("Нажми Play для воспроизведения");
                        });
                    }, 100);
                }
            }

            nextBtn.classList.remove('loading');
            updateStatus("");
        }

        const urlParams = new URLSearchParams(window.location.search);
        const dataParam = urlParams.get('data');
        userId = urlParams.get('user_id');

        if (dataParam && userId) {
            try {
                let base64Fixed = dataParam.replace(/-/g, '+').replace(/_/g, '/');
                while (base64Fixed.length % 4) { base64Fixed += '='; }
                const trackData = JSON.parse(atob(base64Fixed));
                loadTrack(trackData);
            } catch (e) {
                console.error("Ошибка парсинга данных", e);
                titleEl.innerText = "Ошибка загрузки";
            }
        } else {
            titleEl.innerText = "Открой через бота";
            artistEl.innerText = "Нажми /start";
        }
    </script>
</body>
</html>
