<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>QuasWave Player</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg0:#0d2027;
      --bg1:#081418;
      --panel:#12333b;
      --ink:#eaf6f4;
      --muted:#8fb0ac;
      --coral:#ff7a59;
      --gold:#ffc46b;
      --teal:#59e0c8;
      --line:rgba(89,224,200,.22);
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      -webkit-tap-highlight-color:transparent;
    }

    html,body{
      height:100%;
      max-width:100%;
      overflow-x:hidden;
    }

    body{
      min-height:100dvh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(180deg, var(--bg0) 0%, var(--bg1) 100%) fixed;
      color:var(--ink);
      font-family:"Manrope", system-ui, sans-serif;
      overflow-y:auto;
      overflow-x:hidden;
      user-select:none;
    }

    .bg{
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:0;
    }

    .bg::before{
      content:"";
      position:absolute;
      width:70vmax;
      height:70vmax;
      left:-25vmax;
      top:-30vmax;
      background:radial-gradient(circle, rgba(255,122,89,.13), transparent 62%);
    }

    .bg::after{
      content:"";
      position:absolute;
      width:70vmax;
      height:70vmax;
      right:-25vmax;
      bottom:-30vmax;
      background:radial-gradient(circle, rgba(89,224,200,.11), transparent 62%);
    }

    .noise{
      position:fixed;
      inset:0;
      z-index:1;
      pointer-events:none;
      opacity:.05;
      background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2"/></filter><rect width="120" height="120" filter="url(%23n)" opacity="0.7"/></svg>');
    }

    .app{
      position:relative;
      z-index:2;
      width:min(430px, 100%);
      max-width:100%;
      min-height:100dvh;
      padding:calc(18px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom));
      display:flex;
      flex-direction:column;
      gap:18px;
      overflow-x:hidden;
    }

    .top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      min-width:0;
    }

    .logo{
      font-family:"Unbounded", sans-serif;
      font-weight:900;
      font-size:17px;
      letter-spacing:.14em;
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .logo span{
      color:var(--gold);
    }

    .logo .eq{
      display:flex;
      align-items:flex-end;
      gap:2px;
      height:14px;
    }

    .logo .eq i{
      width:3px;
      border-radius:2px;
      background:var(--teal);
      animation:eq 1.1s ease-in-out infinite;
      transform-origin:bottom;
    }

    .logo .eq i:nth-child(1){ height:60%; animation-delay:0s; }
    .logo .eq i:nth-child(2){ height:100%; animation-delay:.15s; }
    .logo .eq i:nth-child(3){ height:45%; animation-delay:.3s; }
    .logo .eq i:nth-child(4){ height:80%; animation-delay:.45s; }

    .badge{
      font-size:10px;
      font-weight:800;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:var(--muted);
      border:1px solid var(--line);
      border-radius:999px;
      padding:6px 12px;
      white-space:nowrap;
    }

    .badge b{
      color:var(--coral);
    }

    .stage{
      position:relative;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:14px 0 4px;
      min-width:0;
    }

    .rings{
      position:absolute;
      top:118px;
      left:50%;
      width:0;
      height:0;
      z-index:0;
    }

    .rings i{
      position:absolute;
      left:50%;
      top:50%;
      width:230px;
      height:230px;
      margin:-115px 0 0 -115px;
      border:1px solid rgba(89,224,200,.28);
      border-radius:50%;
      opacity:0;
      animation:ring 3.9s cubic-bezier(.2,.6,.35,1) infinite;
      animation-play-state:paused;
    }

    .rings i:nth-child(2){ animation-delay:1.3s; }
    .rings i:nth-child(3){ animation-delay:2.6s; }

    body.playing .rings i{
      animation-play-state:running;
    }

    .disc{
      position:relative;
      z-index:1;
      width:216px;
      height:216px;
      border-radius:50%;
      background:
        radial-gradient(circle at 34% 28%, rgba(255,255,255,.10), transparent 42%),
        repeating-radial-gradient(circle, #132a31 0 2px, #0b1c21 2px 4.5px);
      border:1px solid rgba(255,255,255,.07);
      box-shadow:0 24px 60px rgba(0,0,0,.55), inset 0 0 0 10px rgba(0,0,0,.25);
      display:flex;
      align-items:center;
      justify-content:center;
      animation:spin 11s linear infinite;
      animation-play-state:paused;
    }

    body.playing .disc{
      animation-play-state:running;
    }

    .disc-label{
      width:76px;
      height:76px;
      border-radius:50%;
      background:radial-gradient(circle at 35% 30%, var(--gold), var(--coral) 78%);
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:"Unbounded", sans-serif;
      font-weight:900;
      font-size:20px;
      color:#241008;
      box-shadow:0 0 0 6px rgba(0,0,0,.35);
      position:relative;
    }

    .disc-label::after{
      content:"";
      position:absolute;
      width:10px;
      height:10px;
      border-radius:50%;
      background:var(--bg1);
      box-shadow:inset 0 0 3px #000;
    }

    #viz{
      width:100%;
      height:88px;
      margin-top:14px;
      display:block;
    }

    .meta{
      text-align:center;
      min-height:100px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:7px;
      min-width:0;
    }

    .track{
      font-family:"Unbounded", sans-serif;
      font-weight:700;
      font-size:clamp(19px, 5.4vw, 25px);
      line-height:1.25;
      letter-spacing:.01em;
      transition:opacity .25s ease, transform .25s ease;
      overflow-wrap:anywhere;
      word-break:break-word;
    }

    .track.swap{
      opacity:0;
      transform:translateY(8px);
    }

    .artist{
      font-size:13px;
      font-weight:800;
      letter-spacing:.22em;
      text-transform:uppercase;
      color:var(--muted);
      overflow-wrap:anywhere;
      word-break:break-word;
    }

    .wave-mode{
      font-size:12px;
      font-weight:700;
      color:var(--teal);
      letter-spacing:.04em;
      text-align:center;
      min-height:16px;
      overflow-wrap:anywhere;
      word-break:break-word;
    }

    .progress{
      display:flex;
      flex-direction:column;
      gap:8px;
      min-width:0;
    }

    .bar{
      position:relative;
      height:26px;
      display:flex;
      align-items:center;
      cursor:pointer;
      touch-action:none;
    }

    .bar::before{
      content:"";
      position:absolute;
      left:0;
      right:0;
      height:6px;
      border-radius:999px;
      background:rgba(255,255,255,.12);
    }

    .fill{
      position:absolute;
      left:0;
      height:6px;
      border-radius:999px;
      width:0%;
      background:linear-gradient(90deg, var(--teal), var(--gold) 60%, var(--coral));
      box-shadow:0 0 12px rgba(255,196,107,.45);
      transition:width .15s linear;
    }

    .knob{
      position:absolute;
      width:14px;
      height:14px;
      border-radius:50%;
      background:var(--ink);
      box-shadow:0 2px 8px rgba(0,0,0,.5);
      transform:translateX(-50%) scale(0);
      transition:transform .15s ease;
      pointer-events:none;
    }

    .bar:hover .knob,
    .bar.active .knob{
      transform:translateX(-50%) scale(1);
    }

    .times{
      display:flex;
      justify-content:space-between;
      font-size:12px;
      font-weight:600;
      color:var(--muted);
      font-variant-numeric:tabular-nums;
    }

    .volume{
      display:flex;
      align-items:center;
      gap:12px;
      min-height:44px;
      min-width:0;
    }

    .volume button{
      width:44px;
      height:44px;
      border-radius:14px;
      background:var(--panel);
      border:1px solid var(--line);
      color:var(--ink);
      font-size:18px;
      cursor:pointer;
      transition:transform .12s ease, box-shadow .2s ease;
      touch-action:manipulation;
      flex:0 0 auto;
    }

    .volume button:hover{
      transform:translateY(-2px);
      box-shadow:0 8px 18px rgba(0,0,0,.35);
    }

    .volume button:active{
      transform:scale(.92);
    }

    .volume input[type="range"]{
      flex:1 1 auto;
      width:100%;
      min-width:0;
      appearance:none;
      -webkit-appearance:none;
      height:6px;
      border-radius:999px;
      background:rgba(255,255,255,.14);
      outline:none;
      cursor:pointer;
    }

    .volume input[type="range"]::-webkit-slider-thumb{
      -webkit-appearance:none;
      appearance:none;
      width:18px;
      height:18px;
      border-radius:50%;
      background:var(--gold);
      box-shadow:0 0 12px rgba(255,196,107,.55);
      cursor:pointer;
    }

    .volume input[type="range"]::-moz-range-thumb{
      width:18px;
      height:18px;
      border:none;
      border-radius:50%;
      background:var(--gold);
      box-shadow:0 0 12px rgba(255,196,107,.55);
      cursor:pointer;
    }

    .controls{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:16px;
      margin-top:2px;
      min-width:0;
    }

    .controls button{
      border:0;
      cursor:pointer;
      width:58px;
      height:58px;
      border-radius:50%;
      background:var(--panel);
      border:1px solid var(--line);
      color:var(--ink);
      font-size:22px;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:transform .12s ease, box-shadow .2s ease, background .2s ease;
      touch-action:manipulation;
      flex:0 0 auto;
    }

    .controls button:hover{
      transform:translateY(-3px);
      box-shadow:0 10px 24px rgba(0,0,0,.4);
    }

    .controls button:active{
      transform:scale(.9);
    }

    .controls .primary{
      width:80px;
      height:80px;
      font-size:28px;
      background:radial-gradient(circle at 32% 28%, var(--gold), var(--coral) 80%);
      color:#241008;
      border:none;
      box-shadow:0 14px 34px rgba(255,122,89,.35);
    }

    .controls .primary:hover{
      box-shadow:0 18px 44px rgba(255,122,89,.5);
    }

    .controls button.pop{
      animation:pop .55s ease;
    }

    .overlay{
      position:fixed;
      inset:0;
      z-index:20;
      background:rgba(6,14,17,.86);
      display:flex;
      align-items:center;
      justify-content:center;
      opacity:0;
      pointer-events:none;
      transition:opacity .3s ease;
      overflow:hidden;
    }

    .overlay.show{
      opacity:1;
      pointer-events:auto;
    }

    /* Loading теперь не блокирует интерфейс */
    .overlay.loading{
      background:transparent;
      pointer-events:none;
      align-items:flex-end;
      justify-content:center;
      padding-bottom:calc(120px + env(safe-area-inset-bottom));
    }

    .overlay.loading.show{
      pointer-events:none;
    }

    .loading-inner{
      text-align:center;
      display:flex;
      flex-direction:row;
      align-items:center;
      justify-content:center;
      gap:12px;
      max-width:100%;
      background:rgba(16,42,49,.92);
      border:1px solid var(--line);
      border-radius:18px;
      padding:12px 18px;
      box-shadow:0 14px 34px rgba(0,0,0,.45);
      backdrop-filter:blur(8px);
    }

    .eq{
      display:flex;
      align-items:flex-end;
      gap:4px;
      height:22px;
    }

    .eq i{
      width:4px;
      border-radius:4px;
      background:linear-gradient(180deg, var(--teal), var(--gold));
      animation:eq 0.9s ease-in-out infinite;
      transform-origin:bottom;
    }

    .eq i:nth-child(1){ height:40%; animation-delay:0s; }
    .eq i:nth-child(2){ height:80%; animation-delay:.12s; }
    .eq i:nth-child(3){ height:100%; animation-delay:.24s; }
    .eq i:nth-child(4){ height:65%; animation-delay:.36s; }
    .eq i:nth-child(5){ height:45%; animation-delay:.48s; }

    .loading-text{
      font-size:13px;
      font-weight:700;
      color:var(--ink);
      white-space:nowrap;
    }

    .likes-panel{
      width:min(420px, 92vw);
      max-height:72vh;
      background:#102a31;
      border:1px solid var(--line);
      border-radius:20px;
      box-shadow:0 24px 70px rgba(0,0,0,.55);
      display:flex;
      flex-direction:column;
      overflow:hidden;
      max-width:100%;
    }

    .likes-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:16px 18px;
      border-bottom:1px solid rgba(255,255,255,.08);
    }

    .likes-title{
      font-family:"Unbounded", sans-serif;
      font-weight:700;
      font-size:18px;
    }

    .likes-sub{
      margin-top:4px;
      font-size:12px;
      color:var(--muted);
      overflow-wrap:anywhere;
      word-break:break-word;
    }

    .likes-head button{
      width:40px;
      height:40px;
      border:none;
      border-radius:12px;
      background:var(--panel);
      color:var(--ink);
      font-size:16px;
      cursor:pointer;
      transition:transform .12s ease;
      flex:0 0 auto;
    }

    .likes-head button:active{
      transform:scale(.92);
    }

    .likes-list{
      padding:12px;
      height:min(56vh, 480px);
      overflow-y:auto;
      overflow-x:hidden;
      display:flex;
      flex-direction:column;
      gap:8px;
      overscroll-behavior:contain;
      scrollbar-width:thin;
      scrollbar-color:rgba(89,224,200,.35) transparent;
    }

    .likes-list::-webkit-scrollbar{
      width:8px;
    }

    .likes-list::-webkit-scrollbar-track{
      background:transparent;
    }

    .likes-list::-webkit-scrollbar-thumb{
      background:rgba(89,224,200,.35);
      border-radius:999px;
    }

    .likes-item{
      width:100%;
      text-align:left;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.04);
      color:var(--ink);
      border-radius:14px;
      padding:12px 14px;
      font-size:14px;
      font-weight:600;
      cursor:pointer;
      transition:transform .12s ease, background .2s ease, border-color .2s ease;
      overflow-wrap:anywhere;
      word-break:break-word;
      flex:0 0 auto;
    }

    .likes-item:hover{
      background:rgba(89,224,200,.10);
      border-color:rgba(89,224,200,.35);
      transform:translateY(-1px);
    }

    .likes-item:active{
      transform:scale(.98);
    }

    .likes-empty{
      padding:28px 12px;
      text-align:center;
      color:var(--muted);
      font-size:14px;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:calc(26px + env(safe-area-inset-bottom));
      transform:translate(-50%, 80px);
      z-index:30;
      background:#173a41;
      border:1px solid var(--line);
      border-left:4px solid var(--coral);
      color:var(--ink);
      font-size:14px;
      font-weight:600;
      padding:12px 18px;
      border-radius:10px;
      box-shadow:0 14px 34px rgba(0,0,0,.5);
      opacity:0;
      transition:transform .3s cubic-bezier(.2,.9,.3,1.2), opacity .3s ease;
      max-width:88%;
    }

    .toast.show{
      transform:translate(-50%, 0);
      opacity:1;
    }

    audio{
      display:none;
    }

    @keyframes spin{
      to{ transform:rotate(360deg); }
    }

    @keyframes eq{
      0%,100%{ transform:scaleY(.45); }
      50%{ transform:scaleY(1); }
    }

    @keyframes ring{
      0%{ transform:scale(.55); opacity:.55; }
      100%{ transform:scale(1.9); opacity:0; }
    }

    @keyframes pop{
      0%{ transform:scale(1); }
      35%{ transform:scale(1.4) rotate(-8deg); }
      70%{ transform:scale(.92); }
      100%{ transform:scale(1); }
    }
  </style>
</head>

<body>
  <div class="bg"></div>
  <div class="noise"></div>

  <main class="app">
    <header class="top">
      <div class="logo">
        QUAS<span>WAVE</span>
        <span class="eq"><i></i><i></i><i></i><i></i></span>
      </div>
      <div class="badge">волна <b>last.fm</b></div>
    </header>

    <section class="stage">
      <div class="rings"><i></i><i></i><i></i></div>
      <div class="disc"><span class="disc-label">QW</span></div>
      <canvas id="viz"></canvas>
    </section>

    <section class="meta">
      <div class="track" id="title">Готов слушать?</div>
      <div class="artist" id="artist">QuasWave</div>
      <div class="wave-mode" id="waveMode"></div>
    </section>

    <section class="progress">
      <div class="bar" id="bar">
        <div class="fill" id="fill"></div>
        <div class="knob" id="knob"></div>
      </div>
      <div class="times">
        <span id="cur">0:00</span>
        <span id="dur">0:00</span>
      </div>
    </section>

    <section class="volume">
      <button id="muteBtn" aria-label="Mute">🔊</button>
      <input id="volume" type="range" min="0" max="100" value="80" aria-label="Громкость">
      <button id="likesBtn" aria-label="Лайки">❤️</button>
    </section>

    <section class="controls">
      <button id="likeBtn" aria-label="Лайк">👍</button>
      <button id="playBtn" class="primary" aria-label="Плей/пауза">▶</button>
      <button id="nextBtn" aria-label="Следующий">⏭</button>
      <button id="dislikeBtn" aria-label="Дизлайк">👎</button>
    </section>
  </main>

  <div class="overlay loading" id="loadingOverlay">
    <div class="loading-inner">
      <div class="eq"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="loading-text">Загрузка...</div>
    </div>
  </div>

  <div class="overlay" id="likesOverlay">
    <div class="likes-panel">
      <div class="likes-head">
        <div>
          <div class="likes-title">❤️ Лайки</div>
          <div class="likes-sub" id="likesMeta"></div>
        </div>
        <button id="likesClose" aria-label="Закрыть">✖️</button>
      </div>

      <div class="likes-list" id="likesList"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <audio id="audio" crossorigin="anonymous" preload="auto"></audio>

  <script>
    "use strict";

    const APP_VERSION = "20260801-09";
    console.log("QuasWave frontend version:", APP_VERSION);

    // ВАЖНО:
    // Этот URL должен совпадать с EXTERNAL_URL в wave.py.
    const API_BASE = "https://differences-terminal-identical-egg.trycloudflare.com";

    const USE_REAL_VIZ = false;

    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;

    if (tg) {
      try {
        tg.ready();
        tg.expand();

        if (tg.setHeaderColor) {
          tg.setHeaderColor("#0d2027");
        }

        if (tg.setBackgroundColor) {
          tg.setBackgroundColor("#0d2027");
        }
      } catch (e) {
        console.warn("tg init:", e);
      }
    }

    function haptic(type) {
      try {
        if (tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred) {
          tg.HapticFeedback.impactOccurred(type || "light");
        }
      } catch (e) {}
    }

    function apiHeaders(extra) {
      const headers = Object.assign(
        {
          "Accept": "application/json"
        },
        extra || {}
      );

      if (tg && tg.initData) {
        headers["X-Telegram-Init-Data"] = tg.initData;
      }

      return headers;
    }

    const audio = document.getElementById("audio");
    const titleEl = document.getElementById("title");
    const artistEl = document.getElementById("artist");
    const waveModeEl = document.getElementById("waveMode");
    const playBtn = document.getElementById("playBtn");
    const nextBtn = document.getElementById("nextBtn");
    const likeBtn = document.getElementById("likeBtn");
    const dislikeBtn = document.getElementById("dislikeBtn");
    const bar = document.getElementById("bar");
    const fill = document.getElementById("fill");
    const knob = document.getElementById("knob");
    const curEl = document.getElementById("cur");
    const durEl = document.getElementById("dur");
    const loadingOv = document.getElementById("loadingOverlay");
    const toastEl = document.getElementById("toast");
    const viz = document.getElementById("viz");
    const vctx = viz.getContext("2d");

    const volumeInput = document.getElementById("volume");
    const muteBtn = document.getElementById("muteBtn");

    const likesBtn = document.getElementById("likesBtn");
    const likesOverlay = document.getElementById("likesOverlay");
    const likesClose = document.getElementById("likesClose");
    const likesList = document.getElementById("likesList");
    const likesMeta = document.getElementById("likesMeta");

    let userId = null;
    let initialTrack = null;
    let currentTrack = null;
    let playing = false;
    let isLoading = false;
    let isSeeking = false;
    let toastTimer = null;
    let waitingTimer = null;

    let likesPage = 1;
    let likesPages = 1;
    let likesTotal = 0;
    let likesLoading = false;

    function b64UrlDecode(input) {
      let s = String(input).replace(/-/g, "+").replace(/_/g, "/");

      while (s.length % 4) {
        s += "=";
      }

      const binary = atob(s);
      const bytes = new Uint8Array(binary.length);

      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }

      return new TextDecoder("utf-8").decode(bytes);
    }

    (function parseUrl() {
      const params = new URLSearchParams(window.location.search);

      const urlUserId = params.get("user_id");
      const dataParam = params.get("data");

      let dataUserId = null;

      if (dataParam) {
        try {
          initialTrack = JSON.parse(b64UrlDecode(dataParam));
          console.log("Initial track:", initialTrack);

          if (initialTrack && initialTrack.user_id) {
            dataUserId = String(initialTrack.user_id);
          }
        } catch (e) {
          console.error("Не удалось разобрать data:", e);
        }
      }

      if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) {
        userId = String(tg.initDataUnsafe.user.id);
      } else if (urlUserId) {
        userId = String(urlUserId);
      } else if (dataUserId) {
        userId = dataUserId;
      }

      console.log("userId:", userId);
    })();

    function fmt(s) {
      if (!isFinite(s)) return "0:00";
      s = Math.floor(s);
      return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
    }

    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");

      if (toastTimer) clearTimeout(toastTimer);

      toastTimer = setTimeout(() => {
        toastEl.classList.remove("show");
      }, 2600);
    }

    function showLoading(on) {
      loadingOv.classList.toggle("show", !!on);
    }

    function setTrack(artist, title) {
      currentTrack = {
        artist: artist || "",
        title: title || ""
      };

      titleEl.classList.add("swap");

      setTimeout(() => {
        titleEl.textContent = currentTrack.title || "Без названия";
        artistEl.textContent = currentTrack.artist || "Неизвестный артист";
        document.title = (currentTrack.artist ? currentTrack.artist + " — " : "") + currentTrack.title;
        titleEl.classList.remove("swap");
      }, 180);
    }

    function setWaveInfo(mode, seedArtist, seedTrack) {
      if (!waveModeEl) return;

      if (mode === "likes") {
        waveModeEl.textContent = "❤️ Волна по лайкам";
      } else if (mode === "track" && seedArtist && seedTrack) {
        waveModeEl.textContent = `🎶 Волна по треку: ${seedArtist} — ${seedTrack}`;
      } else if (mode === "track") {
        waveModeEl.textContent = "🎶 Волна по треку";
      } else {
        waveModeEl.textContent = "🎵 Волна QuasWave";
      }
    }

    async function loadNextTrack() {
      if (!userId) {
        toast("Нет user_id. Открой плеер из бота.");
        return;
      }

      if (isLoading) return;

      isLoading = true;
      showLoading(true);

      try {
        let url = API_BASE + "/api/next_track?user_id=" + encodeURIComponent(userId);

        if (currentTrack && currentTrack.artist && currentTrack.title) {
          url += "&artist=" + encodeURIComponent(currentTrack.artist);
          url += "&track=" + encodeURIComponent(currentTrack.title);
        }

        const response = await fetch(url, {
          method: "GET",
          cache: "no-store",
          headers: apiHeaders()
        });

        const text = await response.text();

        let data;

        try {
          data = JSON.parse(text);
        } catch (e) {
          throw new Error("Backend вернул не JSON: " + text.slice(0, 160));
        }

        if (!response.ok) {
          throw new Error(data.error || ("HTTP " + response.status));
        }

        setTrack(data.artist, data.title);
        setWaveInfo(data.mode, data.seed_artist, data.seed_track);

        audio.src = data.file_url;
        audio.load();

        await playAudio();

      } catch (err) {
        console.error("loadNextTrack error:", err);
        toast("❌ " + (err.message || "Не удалось загрузить трек"));
      } finally {
        isLoading = false;
        showLoading(false);
      }
    }

    async function startTrack(artist, track) {
      if (!userId) {
        toast("Нет user_id.");
        return;
      }

      if (!artist || !track) {
        toast("Нет данных трека.");
        return;
      }

      showLoading(true);

      try {
        const response = await fetch(API_BASE + "/api/start_track", {
          method: "POST",
          cache: "no-store",
          headers: apiHeaders({
            "Content-Type": "application/json"
          }),
          body: JSON.stringify({
            user_id: Number(userId),
            artist: artist,
            track: track
          })
        });

        const text = await response.text();

        let data;

        try {
          data = JSON.parse(text);
        } catch (e) {
          throw new Error("Backend вернул не JSON: " + text.slice(0, 160));
        }

        if (!response.ok) {
          throw new Error(data.error || ("HTTP " + response.status));
        }

        setTrack(data.artist, data.title);
        setWaveInfo(data.mode, data.seed_artist, data.seed_track);

        audio.src = data.file_url;
        audio.load();

        await playAudio();

      } catch (err) {
        console.error("startTrack error:", err);
        toast("❌ " + (err.message || "Не удалось запустить трек"));
      } finally {
        showLoading(false);
      }
    }

    async function playInitialTrack() {
      if (!initialTrack || !initialTrack.file_url) {
        loadNextTrack();
        return;
      }

      showLoading(true);

      try {
        setTrack(initialTrack.artist, initialTrack.title);
        setWaveInfo(initialTrack.mode, initialTrack.seed_artist, initialTrack.seed_track);

        audio.src = initialTrack.file_url;
        audio.load();

        await playAudio();
      } catch (err) {
        console.error("playInitialTrack error:", err);
        toast("❌ " + (err.message || "Не удалось запустить трек"));
      } finally {
        showLoading(false);
      }
    }

    async function playAudio() {
      try {
        if (audioCtx && audioCtx.state === "suspended") {
          await audioCtx.resume();
        }

        await audio.play();
      } catch (err) {
        console.warn("play() error:", err);
        toast("Нажми ▶, чтобы запустить аудио");
      }
    }

    function pauseAudio() {
      audio.pause();
    }

    async function sendReaction(kind) {
      if (!userId) {
        toast("Нет user_id.");
        return false;
      }

      if (!currentTrack || !currentTrack.artist || !currentTrack.title) {
        toast("Сначала включи трек.");
        return false;
      }

      const endpoint = kind === "like" ? "/api/like" : "/api/dislike";

      try {
        const url =
          API_BASE +
          endpoint +
          "?user_id=" + encodeURIComponent(userId) +
          "&artist=" + encodeURIComponent(currentTrack.artist) +
          "&track=" + encodeURIComponent(currentTrack.title);

        const response = await fetch(url, {
          method: "POST",
          cache: "no-store",
          headers: apiHeaders({
            "Content-Type": "application/json"
          }),
          body: JSON.stringify({
            user_id: Number(userId),
            artist: currentTrack.artist,
            track: currentTrack.title
          })
        });

        const text = await response.text();

        let data;

        try {
          data = JSON.parse(text);
        } catch (e) {
          throw new Error("Backend вернул не JSON: " + text.slice(0, 160));
        }

        if (!response.ok) {
          throw new Error(data.error || ("HTTP " + response.status));
        }

        return true;

      } catch (err) {
        console.error(kind + " error:", err);
        toast("❌ " + (err.message || "Не удалось отправить реакцию"));
        return false;
      }
    }

    function appendLikeItem(item) {
      const btn = document.createElement("button");

      btn.className = "likes-item";
      btn.textContent = `${item.artist} — ${item.track}`;

      btn.addEventListener("click", async () => {
        closeLikes();
        setTrack(item.artist, item.track);
        setWaveInfo("track", item.artist, item.track);
        await startTrack(item.artist, item.track);
      });

      likesList.appendChild(btn);
    }

    async function loadLikes(reset = true) {
      if (!userId) {
        toast("Нет user_id.");
        return;
      }

      if (likesLoading) return;

      if (!reset && likesPage > likesPages) return;

      likesLoading = true;

      const requestPage = reset ? 1 : likesPage;

      if (reset) {
        likesList.innerHTML = '<div class="likes-empty">Загрузка...</div>';
        likesMeta.textContent = `user_id: ${userId}`;
        likesPage = 1;
        likesPages = 1;
        likesTotal = 0;
      }

      try {
        const url =
          API_BASE +
          "/api/likes?user_id=" + encodeURIComponent(userId) +
          "&page=" + encodeURIComponent(requestPage) +
          "&page_size=20";

        const response = await fetch(url, {
          method: "GET",
          cache: "no-store",
          headers: apiHeaders()
        });

        const text = await response.text();

        let data;

        try {
          data = JSON.parse(text);
        } catch (e) {
          throw new Error("Backend вернул не JSON: " + text.slice(0, 160));
        }

        if (!response.ok) {
          throw new Error(data.error || ("HTTP " + response.status));
        }

        if (reset) {
          likesList.innerHTML = "";
        }

        likesPages = data.pages || 1;
        likesTotal = data.total || 0;

        const currentPage = data.page || requestPage;
        likesPage = currentPage + 1;

        likesMeta.textContent = `user_id: ${userId} • всего: ${likesTotal}`;

        if ((!data.items || !data.items.length) && reset) {
          likesList.innerHTML = '<div class="likes-empty">Лайков пока нет.<br>Жми 👍 в плеере.</div>';
          return;
        }

        if (data.items && data.items.length) {
          data.items.forEach(appendLikeItem);
        }

      } catch (err) {
        console.error("loadLikes error:", err);

        if (reset) {
          likesList.innerHTML = `<div class="likes-empty">❌ ${err.message || "Не удалось загрузить лайки"}</div>`;
        } else {
          toast("❌ " + (err.message || "Не удалось загрузить лайки"));
        }
      } finally {
        likesLoading = false;
      }
    }

    function openLikes() {
      likesOverlay.classList.add("show");
      loadLikes(true);
    }

    function closeLikes() {
      likesOverlay.classList.remove("show");
    }

    likesBtn.addEventListener("click", () => {
      haptic("light");
      openLikes();
    });

    likesClose.addEventListener("click", closeLikes);

    likesOverlay.addEventListener("click", (e) => {
      if (e.target === likesOverlay) {
        closeLikes();
      }
    });

    likesList.addEventListener("scroll", () => {
      if (!likesOverlay.classList.contains("show")) return;
      if (likesLoading) return;
      if (likesPage > likesPages) return;

      const nearBottom =
        likesList.scrollTop + likesList.clientHeight >= likesList.scrollHeight - 100;

      if (nearBottom) {
        loadLikes(false);
      }
    });

    let audioCtx = null;
    let analyser = null;
    let dataArr = null;

    function ensureAnalyser() {
      if (!USE_REAL_VIZ) return;
      if (analyser) return;

      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const src = audioCtx.createMediaElementSource(audio);

        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 128;
        analyser.smoothingTimeConstant = 0.82;

        src.connect(analyser);
        analyser.connect(audioCtx.destination);

        dataArr = new Uint8Array(analyser.frequencyBinCount);
      } catch (e) {
        console.warn("WebAudio недоступен, включаю псевдо-волну:", e);
        analyser = null;
      }
    }

    function sizeViz() {
      const dpr = window.devicePixelRatio || 1;
      viz.width = viz.clientWidth * dpr;
      viz.height = viz.clientHeight * dpr;
      vctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    window.addEventListener("resize", sizeViz);
    sizeViz();

    function mix(a, b, t) {
      const pa = parseInt(a.slice(1), 16);
      const pb = parseInt(b.slice(1), 16);

      const r = Math.round(((pa >> 16) & 255) * (1 - t) + ((pb >> 16) & 255) * t);
      const g = Math.round(((pa >> 8) & 255) * (1 - t) + ((pb >> 8) & 255) * t);
      const bl = Math.round((pa & 255) * (1 - t) + (pb & 255) * t);

      return "rgb(" + r + "," + g + "," + bl + ")";
    }

    function drawViz() {
      requestAnimationFrame(drawViz);

      const w = viz.clientWidth;
      const h = viz.clientHeight;

      vctx.clearRect(0, 0, w, h);

      const bars = 52;
      const gap = 3;
      const bw = (w - gap * (bars - 1)) / bars;
      const t = performance.now() / 1000;

      for (let i = 0; i < bars; i++) {
        let v;

        if (analyser && dataArr) {
          if (i === 0) analyser.getByteFrequencyData(dataArr);

          const step = Math.max(1, Math.floor(dataArr.length / bars));
          v = dataArr[i * step] / 255;
        } else {
          v = playing
            ? 0.22 + 0.5 * Math.abs(Math.sin(t * 2.4 + i * 0.55)) * (0.55 + 0.45 * Math.sin(t * 0.9 + i * 1.7))
            : 0.05;
        }

        v = Math.max(0.045, v);

        const bh = v * h;
        const x = i * (bw + gap);
        const y = h - bh;
        const hue = i / bars;

        vctx.fillStyle = hue < 0.5
          ? mix("#59e0c8", "#ffc46b", hue * 2)
          : mix("#ffc46b", "#ff7a59", (hue - 0.5) * 2);

        vctx.beginPath();

        if (vctx.roundRect) {
          vctx.roundRect(x, y, bw, bh, Math.min(3, bw / 2));
        } else {
          vctx.rect(x, y, bw, bh);
        }

        vctx.fill();
      }
    }

    drawViz();

    function getSavedVolume() {
      try {
        const v = parseInt(localStorage.getItem("qw_volume") || "80", 10);

        if (isNaN(v)) return 80;

        return Math.min(100, Math.max(0, v));
      } catch (e) {
        return 80;
      }
    }

    function saveVolume(v) {
      try {
        localStorage.setItem("qw_volume", String(v));
      } catch (e) {}
    }

    function updateMuteIcon() {
      muteBtn.textContent = (audio.muted || audio.volume === 0) ? "🔇" : "🔊";
    }

    const savedVolume = getSavedVolume();

    volumeInput.value = savedVolume;
    audio.volume = savedVolume / 100;
    updateMuteIcon();

    volumeInput.addEventListener("input", () => {
      const v = Number(volumeInput.value);

      audio.volume = v / 100;
      saveVolume(v);

      if (v > 0 && audio.muted) {
        audio.muted = false;
      }

      updateMuteIcon();
    });

    muteBtn.addEventListener("click", () => {
      audio.muted = !audio.muted;
      updateMuteIcon();
      haptic("light");
    });

    audio.addEventListener("play", () => {
      playing = true;
      document.body.classList.add("playing");
      playBtn.textContent = "⏸";
    });

    audio.addEventListener("pause", () => {
      playing = false;
      document.body.classList.remove("playing");
      playBtn.textContent = "▶";
    });

    audio.addEventListener("loadedmetadata", () => {
      durEl.textContent = fmt(audio.duration);
    });

    audio.addEventListener("durationchange", () => {
      durEl.textContent = fmt(audio.duration);
    });

    audio.addEventListener("timeupdate", () => {
      if (isSeeking || !isFinite(audio.duration) || audio.duration <= 0) return;

      const pct = (audio.currentTime / audio.duration) * 100;

      fill.style.width = pct + "%";
      knob.style.left = pct + "%";
      curEl.textContent = fmt(audio.currentTime);
    });

    audio.addEventListener("waiting", () => {
      if (!playing) return;

      if (waitingTimer) clearTimeout(waitingTimer);

      waitingTimer = setTimeout(() => {
        showLoading(true);
      }, 350);
    });

    audio.addEventListener("playing", () => {
      if (waitingTimer) clearTimeout(waitingTimer);
      showLoading(false);
    });

    audio.addEventListener("canplay", () => {
      if (waitingTimer) clearTimeout(waitingTimer);
      if (!audio.paused) showLoading(false);
    });

    audio.addEventListener("seeked", () => {
      if (waitingTimer) clearTimeout(waitingTimer);
      if (!audio.paused) showLoading(false);
    });

    audio.addEventListener("ended", () => {
      console.log("Трек закончился — грузим следующий");
      loadNextTrack();
    });

    audio.addEventListener("error", () => {
      showLoading(false);

      if (audio.src) {
        toast("❌ Не удалось воспроизвести аудио");
      }
    });

    function seekFromEvent(e) {
      const rect = bar.getBoundingClientRect();
      const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));

      fill.style.width = (ratio * 100) + "%";
      knob.style.left = (ratio * 100) + "%";

      if (isFinite(audio.duration) && audio.duration > 0) {
        audio.currentTime = ratio * audio.duration;
      }

      curEl.textContent = fmt(ratio * (audio.duration || 0));
    }

    bar.addEventListener("pointerdown", (e) => {
      isSeeking = true;
      bar.classList.add("active");

      try {
        bar.setPointerCapture(e.pointerId);
      } catch (err) {}

      seekFromEvent(e);
    });

    bar.addEventListener("pointermove", (e) => {
      if (isSeeking) seekFromEvent(e);
    });

    bar.addEventListener("pointerup", () => {
      isSeeking = false;
      bar.classList.remove("active");
    });

    bar.addEventListener("pointercancel", () => {
      isSeeking = false;
      bar.classList.remove("active");
    });

    playBtn.addEventListener("click", async () => {
      haptic("light");
      ensureAnalyser();

      if (!audio.src) {
        await playInitialTrack();
        return;
      }

      if (audio.paused) {
        await playAudio();
      } else {
        pauseAudio();
      }
    });

    nextBtn.addEventListener("click", () => {
      haptic("light");
      loadNextTrack();
    });

    likeBtn.addEventListener("click", async () => {
      const ok = await sendReaction("like");

      if (!ok) return;

      likeBtn.classList.remove("pop");
      void likeBtn.offsetWidth;
      likeBtn.classList.add("pop");

      haptic("medium");
      toast("👍 Добавлено в лайки");
    });

    dislikeBtn.addEventListener("click", async () => {
      const ok = await sendReaction("dislike");

      if (!ok) return;

      haptic("medium");
      toast("👎 Трек исключён из волны");

      loadNextTrack();
    });

    if (initialTrack && initialTrack.file_url) {
      setTrack(initialTrack.artist, initialTrack.title);
      setWaveInfo(initialTrack.mode, initialTrack.seed_artist, initialTrack.seed_track);
    }
  </script>
</body>
